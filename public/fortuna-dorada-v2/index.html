<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Fortuna Dorada · Sala Crespo Club</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0406; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; }
  .hint { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.22);
          font: 11px 'Segoe UI', sans-serif; letter-spacing: 1px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-filters@5.3.0/dist/browser/pixi-filters.js" crossorigin="anonymous"></script>
<script src="giro-diario-assets/assets-data.js"></script>
<script src="giro-diario-assets/fondo-video-data.js"></script>
<script>
function mostrarErrorPantalla(msg) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;color:#f87171;font:13px monospace;z-index:99;background:rgba(0,0,0,.85);padding:8px;border-radius:8px;';
  d.textContent = 'PROBLEMA: ' + msg;
  document.body.appendChild(d);
}
window.addEventListener('error', e => mostrarErrorPantalla(e.message + ' @ ' + (e.lineno || '?')));
window.addEventListener('unhandledrejection', e => mostrarErrorPantalla(e.reason?.message || String(e.reason)));

// ═══════════════════════════════════════════════════════════════════
//  GIRO DIARIO v2 — arte final (assets ./giro-diario-assets/)
//  Tabla DEMO: en producción el premio lo decide POST /api/loyalty/spin
//  (1 giro/día por socio, % y stock diario configurados en el admin).
// ═══════════════════════════════════════════════════════════════════

const PREMIOS = [
  { id: 'ticket',  label: 'TICKET $5.000', pct: 2,  sym: 'lingote', color: 0xF0D275 },
  { id: 'pts500',  label: '+500 PUNTOS',   pct: 5,  sym: 'fenix',   color: 0xF0D275 },
  { id: 'pts250',  label: '+250 PUNTOS',   pct: 8,  sym: 'gato',    color: 0xF0D275 },
  { id: 'pts150',  label: '+150 PUNTOS',   pct: 12, sym: 'koi',     color: 0x7ee2a0 },
  { id: 'pts100',  label: '+100 PUNTOS',   pct: 15, sym: 'rana',    color: 0x7ee2a0 },
  { id: 'pts50',   label: '+50 PUNTOS',    pct: 18, sym: 'arbol',   color: 0xC9A84C },
  { id: 'nada',    label: 'SEGUÍ PARTICIPANDO', pct: 40, sym: null, color: 0x998d75 },
];

const SYMS = ['lingote', 'fenix', 'gato', 'koi', 'rana', 'arbol', 'nudo'];
// Ventana transparente del marco en FRACCIONES de la imagen (medida por canal
// alfa: x164-1496, y203-736 sobre 1659×948) — así vale para cualquier escala.
const VENT_FRAC = { x: 164 / 1659, y: 203 / 948, w: 1333 / 1659, h: 534 / 948 };
// El gabinete tiene un monitor 5:4 (1280x1024) y hay pantallas 16:9: el juego
// se arma en la proporción real para no dejar franjas negras. En 5:4 la tabla
// de premios va en una fila debajo del marco (hay altura de sobra, no ancho).
// ?forma=cuadrada fuerza el layout del gabinete (5:4) en cualquier pantalla,
// para poder revisarlo sin ir hasta la maquina. ?forma=ancha fuerza el 16:9.
const paramForma = new URLSearchParams(location.search).get('forma');
const CUADRADA = paramForma === 'cuadrada' ? true
               : paramForma === 'ancha' ? false
               : (innerWidth / innerHeight) < 1.45;
const W = CUADRADA ? 1280 : 1600;
const H = CUADRADA ? 1024 : 900;

// MODO LIVIANO — las PCs de gabinete no tienen placa de video: si WebGL corre
// por software, el video de fondo + blur + partículas lo dejan a 5 fps (y el
// audio ni arranca). Se detecta al inicio y además se mide el fps real.
// Forzar a mano: ?liviano=1 · forzar completo: ?liviano=0
const paramLiviano = new URLSearchParams(location.search).get('liviano');
function glPorSoftware() {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (!gl) return true;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
    return /swiftshader|software|llvmpipe|microsoft basic|generic/i.test(r);
  } catch { return true; }
}
function maquinaLenta() {   // lo aprendido en ESTA maquina (perfil de Chrome)
  try { return localStorage.getItem('fd_maquina_lenta') === '1'; } catch { return false; }
}
function recordarMaquinaLenta(nivel) {
  try { localStorage.setItem('fd_maquina_lenta', '1'); localStorage.setItem('fd_nivel', String(nivel)); } catch {}
}
let LIVIANO = paramLiviano === '1' ? true
            : paramLiviano === '0' ? false
            : (glPorSoftware() || maquinaLenta());
// si ya se sabe que ni en liviano alcanza, arranca directo con menos pixeles
let nivelGuardado = 0;
try { nivelGuardado = Number(localStorage.getItem('fd_nivel')) || 0; } catch {}

const app = new PIXI.Application({ background: '#0a0406', width: W, height: H,
  // La calidad de dibujo se mantiene: lo caro es el video de fondo y el blur,
  // no la nitidez. Si aun asi no alcanza, se baja despues (ver vigilarFps).
  antialias: nivelGuardado < 2, resolution: nivelGuardado >= 2 ? 0.75 : 1, powerPreference: 'high-performance' });
if (LIVIANO) console.log('Fortuna Dorada: modo liviano (sin placa de video)');
document.getElementById('stage').appendChild(app.view);

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  Object.assign(app.view.style, {
    width: W * s + 'px', height: H * s + 'px', position: 'absolute',
    left: (innerWidth - W * s) / 2 + 'px', top: (innerHeight - H * s) / 2 + 'px',
  });
}
addEventListener('resize', fit); fit();

// Los PNGs viven embebidos como data URIs en assets-data.js (window.GIRO_ASSETS):
// con file:// Chrome bloquea tanto fetch como imágenes locales en WebGL
// (SecurityError texImage2D). Un data URI es same-origin y WebGL lo acepta.
const GA = window.GIRO_ASSETS || {};
const URLS = {
  fondo: GA['fondo'], marco: GA['marco-rodillos'], panel: GA['panel-premios'], logo: GA['logo'],
  lingote: GA['lingote'], fenix: GA['fenix'], gato: GA['gato'],
  koi: GA['koi'], rana: GA['rana'], arbol: GA['arbol'], nudo: GA['nudo'],
};
if (!GA['fondo']) mostrarErrorPantalla('No se encontró giro-diario-assets/assets-data.js al lado del HTML.');

// ─── Sonido sintetizado (los definitivos vienen después) ───────────
let actx = null;
function beep(freq, dur, vol, tipo) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = tipo || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const jingle = () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .28, .12, 'triangle'), i * 120));

// ─── Voz del Club (MP3s pregrabados con ElevenLabs; si falta el audio,
//     la pantalla sigue funcionando muda — nunca romper el flujo) ────
const VOZ_DIR = 'giro-diario-assets/voz-eleven/';
const SFX_DIR2 = 'giro-diario-assets/sfx/';

// Audio de kiosk: los MP3 se precargan al abrir y se "desbloquean" con el
// primer toque (play+pause en silencio). Sin esto, en modo kiosk el play()
// programatico falla callado y el juego queda mudo.
const poolAudio = {};
function audioDe(url) {
  let a = poolAudio[url];
  if (!a) { a = new Audio(url); a.preload = 'auto'; poolAudio[url] = a; }
  return a;
}
const AUDIOS_PRECARGA = [
  ...['giro-bienvenida', 'giro-suerte', 'giro-ticket', 'giro-500', 'giro-250', 'giro-150',
      'giro-100', 'giro-50', 'giro-nada', 'giro-nada-quedan', 'giro-ya-giro'].map(n => VOZ_DIR + n + '.mp3'),
  ...['spin-loop', 'reel-stop', 'win-gong', 'win-coins', 'big-win', 'lose-soft', 'ui-tap',
      'musica-ambiente'].map(n => SFX_DIR2 + n + '.mp3'),
];
AUDIOS_PRECARGA.forEach(audioDe);
let audioListo = false;
const DEMO_KIOSK = new URLSearchParams(location.search).get('demo') === '1';
// ─── BONUS (demo-only for now; the server does not support it yet) ──
const BONUS_PROB = 0.03;              // demo: chance of a bonus per spin
const BONUS_VOZ_ENTRADA = 'bonus-B';  // entrance voice: 'bonus-A' | 'bonus-B' | 'bonus-C'
const BONUS_TEASE_2 = 0.08;           // non-bonus spin: logos on reels 1+2 (anticipation)
const BONUS_TEASE_1 = 0.14;           // non-bonus spin: a single logo
const BONUS_FILLER_PROB = 0.06;       // logo frequency in the spinning strips
if (DEMO_KIOSK) {
  [BONUS_VOZ_ENTRADA, 'bonus-elegi', 'bonus-casi', 'bonus-casi-ticket', 'bonus-casi-1000']
    .forEach(n => audioDe(VOZ_DIR + n + '.mp3'));
  audioDe(SFX_DIR2 + 'bonus-musica.mp3'); audioDe(SFX_DIR2 + 'bonus-musica.mp3?b');
  ['bonus-scatter-1', 'bonus-scatter-2', 'bonus-scatter-3', 'bonus-flip', 'bonus-reveal', 'bonus-pair', 'bonus-trio']
    .forEach(n => audioDe(SFX_DIR2 + n + '.mp3'));
}
function desbloquearAudio() {
  if (audioListo) return;
  audioListo = true;
  // muted (no volume 0): con volumen algunos navegadores dejan escapar un
  // fragmento audible antes de silenciar, y se escuchaba todo junto
  Object.values(poolAudio).forEach(a => {
    if (!a.paused) return;   // la musica ya esta sonando: no tocarla
    if (DEMO_KIOSK) {
      // kiosk demo on phones: play() resolves only after the download and the
      // muted clip could be heard (e.g. BIG WIN on open). Start and stop in the
      // same tick: the element gets unlocked without any sound.
      a.muted = true;
      const q = a.play();
      a.pause();
      if (q) q.catch(() => {}).finally(() => { a.muted = false; });
      else a.muted = false;
      return;
    }
    a.muted = true;
    const p = a.play();
    if (p) p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
           .catch(() => { a.muted = false; });
    else a.muted = false;
  });
  arrancarMusica();   // si la politica de autoplay la habia frenado, ahora si
}
window.addEventListener('pointerdown', desbloquearAudio);
window.addEventListener('touchstart', desbloquearAudio);

let vozActual = null;
function voz(nombre) {
  try {
    if (vozActual && !vozActual.paused) { vozActual.pause(); vozActual.currentTime = 0; }
    const a = audioDe(VOZ_DIR + nombre + '.mp3');
    a.volume = 0.95;
    try { a.currentTime = 0; } catch {}
    vozActual = a;
    const p = a.play();
    if (p) p.catch(err => console.warn('voz ' + nombre + ' bloqueada:', err && err.name));
  } catch (e) { console.warn('voz', e); }
}
const vozDice = (frag) => vozActual && !vozActual.paused && !vozActual.ended && vozActual.src.includes(frag);

// ─── SFX + música (ElevenLabs; mismo criterio: fallo silencioso) ────
const SFX_DIR = 'giro-diario-assets/sfx/';
function sfx(nombre, vol = 0.8, loop = false) {
  try {
    const a = audioDe(SFX_DIR + nombre + '.mp3');
    a.volume = vol; a.loop = loop;
    try { a.currentTime = 0; } catch {}
    const p = a.play();
    if (p) p.catch(err => console.warn('sfx ' + nombre + ' bloqueado:', err && err.name));
    return a;
  } catch { return null; }
}
let spinSound = null;
// Música ambiental en loop suave. Se intenta al cargar (funciona si Chrome
// corre con --autoplay-policy=no-user-gesture-required, como en el gabinete);
// si la política lo bloquea, arranca con el primer gesto.
let musica = null;
function arrancarMusica() {
  if (musica && !musica.paused) return;   // ya suena
  if (musica) { musica.play().catch(() => {}); return; }   // quedo pausada: reanudar
  try {
    const m = audioDe(SFX_DIR + 'musica-ambiente.mp3');
    m.volume = 0.3; m.loop = true;
    m.play().then(() => { musica = m; }).catch(() => {});
  } catch {}
}
arrancarMusica();
window.addEventListener('pointerdown', arrancarMusica);
const VOZ_PREMIO = { ticket: 'giro-ticket', pts500: 'giro-500', pts250: 'giro-250',
  pts150: 'giro-150', pts100: 'giro-100', pts50: 'giro-50', nada: 'giro-nada' };
// server mode: el premio llega con símbolo, no con id de demo
const VOZ_SYM = { fenix: 'giro-500', gato: 'giro-250', koi: 'giro-150', rana: 'giro-100', arbol: 'giro-50' };

// Carga vía <img> (no fetch): funciona abriendo el archivo con doble click
// (Chrome bloquea fetch sobre file://, por eso Assets.load dejaba todo negro).
function cargarTexturas(urls) {
  return Promise.all(Object.entries(urls).map(([k, u]) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res([k, PIXI.Texture.from(img)]);
    img.onerror = () => rej(new Error('No se pudo cargar ' + u + ' — ¿está la carpeta giro-diario-assets al lado del HTML?'));
    img.src = u;
  }))).then(Object.fromEntries);
}

// BONUS symbol (Jackpoints logo) loaded from its file. Only over http(s): on
// file:// a canvas drawn from a local image taints WebGL. Baked into a square
// texture with a soft golden glow. Failure = bonus disabled, game unaffected.
function cargarBonusTex() {
  return new Promise((res) => {
    if (location.protocol === 'file:') { res(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const S = 512, cv = document.createElement('canvas');
        cv.width = cv.height = S;
        const c = cv.getContext('2d');
        const k = Math.min((S * 0.92) / img.width, (S * 0.92) / img.height);
        const w = img.width * k, h = img.height * k, x = (S - w) / 2, y = (S - h) / 2;
        c.shadowColor = 'rgba(255,214,90,0.95)'; c.shadowBlur = 26;
        c.drawImage(img, x, y, w, h);
        c.shadowBlur = 0;
        c.drawImage(img, x, y, w, h);
        res({ glow: PIXI.Texture.from(cv), raw: PIXI.Texture.from(img) });
      } catch (e) { console.warn('bonus textura:', e); res(null); }
    };
    img.onerror = () => { console.warn('No se pudo cargar bonus-jackpoints.webp: bonus desactivado'); res(null); };
    img.src = 'giro-diario-assets/bonus-jackpoints.webp';
  });
}

cargarTexturas(URLS)
  .then(T => cargarBonusTex().then(b => { T.bonus = b ? b.glow : null; T.bonusLogo = b ? b.raw : null; return T; }))
  .then(T => {
 try {

  // ─── Fondo ───────────────────────────────────────────────────────
  const fondo = new PIXI.Sprite(T.fondo);
  const fs = Math.max(W / fondo.texture.width, H / fondo.texture.height);
  fondo.scale.set(fs); fondo.anchor.set(0.5); fondo.position.set(W / 2, H / 2);
  app.stage.addChild(fondo);

  // Animated background: Flow/Seedance clip embedded as a data URI
  // (file:// taints local video for WebGL, same as images — data: is same-origin).
  // The static PNG stays as first frame / fallback until the video can play.
  let videoFondo = null;
  if (window.GIRO_FONDO_VIDEO && !LIVIANO) {
    const vid = document.createElement('video');
    videoFondo = vid;
    vid.muted = true; vid.loop = true; vid.playsInline = true;
    vid.addEventListener('canplaythrough', () => {
      try {
        fondo.texture = PIXI.Texture.from(vid);
        const vs = Math.max(W / vid.videoWidth, H / vid.videoHeight);
        fondo.scale.set(vs);
        vid.play().catch(() => {});
      } catch (e) { console.error('video fondo:', e); }
    }, { once: true });
    vid.src = window.GIRO_FONDO_VIDEO;
    vid.load();
  }

  // ─── Textura radial reutilizable (halos, motas, chispas, flash) ──
  function texturaRadial(hex, size = 256) {
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    const gr = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.35, `rgba(${r},${g},${b},0.45)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, size, size);
    return PIXI.Texture.from(cv);
  }
  const TEX_GLOW = texturaRadial(0xF0D275);

  // ─── FONDO VIVO: brasas doradas flotando + respiración de luz ────
  const motas = [];
  const motasLayer = new PIXI.Container();
  for (let i = 0; i < (LIVIANO ? 12 : 44); i++) {
    const m = new PIXI.Sprite(TEX_GLOW);
    m.anchor.set(0.5);
    const s = 3 + Math.random() * 9;
    m.width = m.height = s;
    m.x = Math.random() * W; m.y = Math.random() * H;
    m.alpha = 0.1 + Math.random() * 0.28;
    m.vy = 0.15 + Math.random() * 0.5;
    m.sway = Math.random() * Math.PI * 2;
    m.blendMode = PIXI.BLEND_MODES.ADD;
    motasLayer.addChild(m); motas.push(m);
  }
  app.stage.addChild(motasLayer);

  const respiro = new PIXI.Sprite(TEX_GLOW);
  respiro.anchor.set(0.5); respiro.position.set(W / 2, H / 2 - 60);
  respiro.width = 1500; respiro.height = 1000;
  respiro.alpha = 0.05; respiro.blendMode = PIXI.BLEND_MODES.ADD;
  app.stage.addChild(respiro);

  // ─── Header: logo + título ───────────────────────────────────────
  const logo = new PIXI.Sprite(T.logo);
  logo.height = 104; logo.scale.x = logo.scale.y; logo.anchor.set(0.5);
  const t1 = new PIXI.Text('SALA CRESPO CLUB', new PIXI.TextStyle({
    fontFamily: 'Georgia', fontSize: 20, fontWeight: '700', fill: '#C9A84C', letterSpacing: 9,
  }));
  t1.anchor.set(0.5, 1); t1.position.set(W / 2, 40);
  const t2 = new PIXI.Text('FORTUNA DORADA', new PIXI.TextStyle({
    fontFamily: 'Georgia', fontSize: 46, fontWeight: '900',
    fill: ['#ffffff', '#F0D275'], fillGradientStops: [0.25, 1], letterSpacing: 5,
    dropShadow: true, dropShadowColor: '#000', dropShadowBlur: 12, dropShadowDistance: 4,
  }));
  t2.anchor.set(0.5, 0); t2.position.set(W / 2, 40);
  // logo a la izquierda del bloque de título, centrado el conjunto
  logo.position.set(W / 2 - t2.width / 2 - 80, 58);
  const t3 = new PIXI.Text('GRATUITO · PARTICIPÁ Y GANÁ PUNTOS Y PREMIOS', new PIXI.TextStyle({
    fontFamily: 'Segoe UI', fontSize: 17, fontWeight: '700', fill: '#e8dfca', letterSpacing: 3.5,
  }));
  t3.anchor.set(0.5, 0); t3.position.set(W / 2, 98);
  app.stage.addChild(logo, t1, t2, t3);

  // ═══════════════════════════════════════════════════════════════
  //  v2 — 3×3 grid, 3 horizontal paylines, frame drawn in code.
  //  Reels are virtual infinite strips: strip[k] = symbol at index k,
  //  sprite for index k sits at y = vent.y + CELL_H*(pos - k + 0.5).
  //  pos only moves continuously; textures are assigned exclusively to
  //  indices that are outside the window (see dibujarReel).
  // ═══════════════════════════════════════════════════════════════
  const PARAMS = new URLSearchParams(location.search);
  const DEBUG = PARAMS.get('debug') === '1';
  // Bonus only in demo (?demo=1) and only while no server session is active
  let bonusHabilitado = DEMO_KIOSK && !!T.bonus;
  let bonus = null;                 // pick-game state while the bonus runs
  let bonusRayos = 0;               // 0..1 rays for the bonus entrance
  let bonusMusicaOn = false;        // bonus loop on / game music faded out
  const scatterFila = [-1, -1, -1]; // row of the landed logo per reel (-1 = none)
  let scatterN = 0;                 // logos landed so far in this spin
  let scatterSonidos = [];          // debug: scatter sounds played this spin
  let scatter3En = 0;               // when scatter-3 started (bonus entrance timing)
  const BONUS_VOZ_DELAY_MS = 650;   // voice/entrance offset after scatter-3 starts
  const COLS = 3, ROWS = 3;
  const CELL_H = CUADRADA ? 205 : 180;
  const CELL_W = CUADRADA ? 230 : 215;
  const BORDE = 26;
  const vent = { w: CELL_W * COLS, h: CELL_H * ROWS };
  vent.x = Math.round((W - vent.w) / 2);
  vent.y = CUADRADA ? 168 : 156;
  const marcoX = vent.x - BORDE, marcoY = vent.y - BORDE;
  const marcoW = vent.w + BORDE * 2, marcoH = vent.h + BORDE * 2;
  const SYM_SIZE = Math.min(CELL_W, CELL_H) * 0.9;
  const rowCenterY = (row) => vent.y + CELL_H * (row + 0.5);
  const reelCenterX = (i) => vent.x + CELL_W * (i + 0.5);

  // Canvas-2D textures (gradients/shadows are cheap there), drawn at 1.5x
  const CV_RES = 1.5;
  function canvasTex(w, h, draw) {
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(w * CV_RES); cv.height = Math.ceil(h * CV_RES);
    const ctx = cv.getContext('2d');
    ctx.scale(CV_RES, CV_RES);
    draw(ctx);
    return PIXI.Texture.from(cv);
  }
  function spriteDe(tex, x, y) {
    const s = new PIXI.Sprite(tex); s.scale.set(1 / CV_RES); s.position.set(x, y); return s;
  }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  // Index range [base-3, base+2] (6 = POOL): base+2 covers [frac-2, frac-1] — fully ABOVE
  // the window — and the index a recycled slot leaves (k-6 = base-4) is fully
  // below it. So a texture is only ever assigned off-screen, as long as pos
  // advances < 1 cell per frame (guaranteed by V_MAX and the dt cap).
  function dibujarReel(r) {
    const base = Math.floor(r.pos);
    for (let k = base - 3; k <= base + 2; k++) {

      if (sp.k !== k) {

  const combos = PREMIOS.filter(p => p.sym);

  // Full-screen gold flash (ticket)
  const fogonazo = new PIXI.Graphics().beginFill(0xFFE9A0).drawRect(0, 0, W, H).endFill();
  fogonazo.alpha = 0; fogonazo.blendMode = PIXI.BLEND_MODES.ADD;

  // ─── Partículas ──────────────────────────────────────────────────
  const parts = [];

  const monedaTex = (() => {

  const tweens = [];
  function squash(sp) { tweens.push({ tipo: 'squash', sp, t: 0, dur: 420 }); }
  function flash(x, y, a) {
    const f = new PIXI.Sprite(TEX_GLOW);
    f.anchor.set(0.5); f.position.set(x, y);
    f.width = f.height = SYM_SIZE * 1.3; f.alpha = a; f.a0 = a; f.blendMode = PIXI.BLEND_MODES.ADD;
    reelLayer.addChild(f);
    tweens.push({ tipo: 'flash', sp: f, t: 0, dur: 320 });
  }
  function chispas(x, y, n) {
    for (let i = 0; i < n; i++) {
      const p = new PIXI.Sprite(TEX_GLOW);
      p.anchor.set(0.5); p.width = p.height = 6 + Math.random() * 10;
      p.blendMode = PIXI.BLEND_MODES.ADD;
      p.position.set(x + (Math.random() - 0.5) * SYM_SIZE * 0.7, y);
      p.vx = (Math.random() - 0.5) * 10; p.vy = -3 - Math.random() * 7;
      p.rot = 0; p.vida = 0.9;
      app.stage.addChild(p); parts.push(p);
    }
  }
  function cortarTweensSimbolos() {
    for (let i = tweens.length - 1; i >= 0; i--) {
      if (tweens[i].tipo === 'squash') tweens.splice(i, 1);
    }
    reels.forEach(r => r.pool.forEach(sp => { sp.width = sp.height = SYM_SIZE; }));
  }
  let sacudidaHasta = 0, sacudidaAmp = 0;

  // ─── Sorteo (DEMO — producción: servidor) ────────────────────────
  function sortear() {
    const r = Math.random() * 100; let acc = 0;
    for (const p of PREMIOS) { acc += p.pct; if (r < acc) return p; }
    return PREMIOS[PREMIOS.length - 1];
  }
  // DEMO-only outcome forcing for tests: &forzar=pts250,nada,casi,ticket&linea=0,2
  const FORZAR = DEMO_KIOSK ? (PARAMS.get('forzar') || '').split(',').filter(Boolean) : [];
  const LINEAS_F = DEMO_KIOSK ? (PARAMS.get('linea') || '').split(',').filter(s => /^[0-2]$/.test(s)).map(Number) : [];
  let giroDemoN = 0;

  const otroSym = (no, sinNudo) => {
    let s = baseSym();
    while (s === no || (sinNudo && s === 'nudo')) s = baseSym();
    return s;
  };
  // Builds the 3×3 result: g[reel] = [top, middle, bottom].
  // Win: the prize symbol on ONE random payline; no other row may be 3-of-a-kind.
  // Nada: no row 3-of-a-kind; near-misses often (like v1's comboPara).
  // BONUS (scatter): one Jackpoints logo on EACH reel, any row. Non-bonus
  // spins: at most one logo per reel and never on all 3 reels (tease only).
  function gridPara(premio, lineaForzada) {
    const g = [0, 1, 2].map(() => [baseSym(), baseSym(), baseSym()]);
    let linea = -1, filaCasi = -1, scatter = null;
    const esBonus = premio.sym === 'bonus' && bonusHabilitado;
    const sym = esBonus ? null
      : premio.sym ? (SYMS.includes(premio.sym) && premio.sym !== 'nudo' ? premio.sym : 'lingote') : null;
    if (esBonus) {
      for (let row = 0; row < ROWS; row++) if (g[0][row] === g[1][row]) g[1][row] = otroSym(g[0][row]);
    } else if (sym) {
      linea = lineaForzada != null ? lineaForzada : (Math.random() * ROWS) | 0;
      for (let i = 0; i < COLS; i++) g[i][linea] = sym;
    } else {
      // pairs on reels 1-2 trigger the anticipation: only when designed
      for (let row = 0; row < ROWS; row++) if (g[0][row] === g[1][row]) g[1][row] = otroSym(g[0][row]);
      const fila = lineaForzada != null ? lineaForzada : (Math.random() * ROWS) | 0;
      const a = Math.random() < 0.45 ? (Math.random() < 0.5 ? 'lingote' : 'fenix') : otroSym(null, true);
      const b = otroSym(a);
      const roll = premio.casi ? 0 : Math.random();
      if (roll < 0.85) filaCasi = fila;
      if (roll < 0.6) { g[0][fila] = a; g[1][fila] = a; g[2][fila] = b; }          // A A B (anticipation)
      else if (roll < 0.85) {                                                       // A B A / B A A
        if (Math.random() < 0.5) { g[0][fila] = a; g[1][fila] = b; g[2][fila] = a; }
        else { g[0][fila] = b; g[1][fila] = a; g[2][fila] = a; }
      }
    }
    const evitar = linea >= 0 ? linea : filaCasi;
    const filaLibre = () => { let f; do { f = (Math.random() * ROWS) | 0; } while (f === evitar); return f; };
    if (esBonus) {
      scatter = [0, 1, 2].map(() => (Math.random() * ROWS) | 0);
      scatter.forEach((f, i) => { g[i][f] = 'bonus'; });
    } else if (bonusHabilitado) {
      const roll = premio.tease ? 0 : Math.random();
      if (roll < BONUS_TEASE_2) { g[0][filaLibre()] = 'bonus'; g[1][filaLibre()] = 'bonus'; }
      else if (roll < BONUS_TEASE_2 + BONUS_TEASE_1) g[(Math.random() * COLS) | 0][filaLibre()] = 'bonus';
    }
    for (let row = 0; row < ROWS; row++) {
      if (row !== linea && g[0][row] !== 'bonus' && g[0][row] === g[1][row] && g[1][row] === g[2][row]) g[2][row] = otroSym(g[0][row]);
    }
    return { g, linea, sym: esBonus ? 'bonus' : sym, scatter };
  }
  const filasConPar = (g) => {
    const out = [];
    for (let row = 0; row < ROWS; row++) if (g[0][row] === g[1][row] && g[0][row] !== 'nudo' && g[0][row] !== 'bonus') out.push(row);
    return out;
  };

  // initial screen: a random non-winning grid already in the strips
  (() => {
    const { g } = gridPara({ sym: null });
    reels.forEach((r, i) => {
      for (let row = 0; row < ROWS; row++) r.strip.set(-row, g[i][row]);
      dibujarReel(r);
    });
  })();

  // ─── Spin ────────────────────────────────────────────────────────
  // SERVER MODE: the kiosk parent posts {tipo:'init', token, apiBase}; the
  // outcome then ALWAYS comes from POST /api/loyalty/spin (rolling window and
  // daily stock live server-side). Opened standalone (no init) = DEMO mode.
  const GIROS_PERMITIDOS = Math.max(1, Number(new URLSearchParams(location.search).get('giros')) || 1);
  let girosUsados = 0;
  let girosTotal = GIROS_PERMITIDOS, girosRestantes = GIROS_PERMITIDOS;
  let girando = false, yaGiroHoy = false, resolviendo = false;
  const pintarGiroLabel = () => { if (window.__actualizarGiroLabel) window.__actualizarGiroLabel(girosTotal, girosRestantes); };
  let SRV = null; // { token, apiBase }
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.tipo === 'init' && e.data.token) {
      SRV = { token: e.data.token, apiBase: e.data.apiBase || '', kioskKey: e.data.kioskKey || '' };
      bonusHabilitado = false;   // server mode never produces a bonus (not supported yet)
      voz('giro-bienvenida');
      fetch(SRV.apiBase + '/api/loyalty/spin-status', { headers: { Authorization: 'Bearer ' + SRV.token } })
        .then(r => r.json())
        .then(s => {
          if (typeof s.left === 'number') {
            yaGiroHoy = s.left <= 0;
            girosTotal = s.porVentana || 2;
            girosRestantes = s.left;
            pintarGiroLabel();
          }
        })
        .catch(() => {});
    }
  });
  try { window.parent.postMessage({ tipo: 'listo' }, '*'); } catch {}
  // kiosk demo (/kiosk?demo=1) never sends init: greet here like the real kiosk does
  if (new URLSearchParams(location.search).get('demo') === '1') voz('giro-bienvenida');
  // cada toque dentro del juego renueva la sesion del kiosk (el padre no ve
  // los eventos del iframe: sin esto la sesion quedaria abierta para siempre)
  window.addEventListener('pointerdown', () => {
    try { window.parent.postMessage({ tipo: 'actividad' }, '*'); } catch {}
  });
  pintarGiroLabel();

  // Motion constants (cells, seconds)
  const WIND_A = 0.22, WIND_T = 0.3;        // wind-up: reels rise a bit before falling
  const ACEL_K = 6;                          // exponential approach to cruise speed (1/s)
  const V_MAX = 14;                          // hard cap: < 1 cell per (capped) frame
  const V_ANTICIP = 13.5;
  const V_LLEGADA = 4.4;                     // speed when the symbols reach the line
  const RES_W = 2 * Math.PI * 3.2, RES_Z = 0.42; // landing spring: ~0.13 cell overshoot
  const RES_ZW = RES_Z * RES_W, RES_WD = RES_W * Math.sqrt(1 - RES_Z * RES_Z);
  const RES_T = 0.6;

  let resultado = null;      // { premio, g, linea, sym, pares }
  let anticip = null;        // { desde, hasta, pares, fin }
  let festejo = null;        // { fila, desde, hasta, sps }
  let riser = null;

  function arrancarRodillos() {
    const ahora = performance.now();
    cortarTweensSimbolos();
    limpiarLinea();
    festejo = null; resultado = null; anticip = null;
    scatterFila.fill(-1); scatterN = 0; scatterSonidos = [];
    badges.forEach(b => { b.glow.alpha = 0; });
    reels.forEach((r, i) => {
      r.estado = 'windup'; r.t0 = ahora + i * 90; r.p0 = r.pos; r.vel = 0;
      r.vObj = 10.5 + i * 0.5; r.adelanto = 5;
      r.stopAt = Infinity; // spins "forever" until the result is known
      r.objetivo = null;
      const lim = Math.floor(r.pos) - 10; // prune old strip entries
      for (const k of r.strip.keys()) if (k < lim) r.strip.delete(k);
    });
  }
  function fijarResultado(premio) {
    const res = gridPara(premio, premio.lineaForzada);
    res.premio = premio;
    res.pares = filasConPar(res.g);
    res.anticipScatter = res.g[0].includes('bonus') && res.g[1].includes('bonus');
    resultado = res;
    const ahora = performance.now();
    reels.forEach((r, i) => {
      r.objetivo = res.g[i];
      r.stopAt = ahora + 1100 + i * 1200;
    });
    if (res.pares.length || res.anticipScatter) reels[COLS - 1].stopAt += 1400; // anticipation: last reel spins longer
    window.__premio = premio;
  }

  boton.on('pointertap', async () => {
    if (girando || bonus) return;
    ocultarCartel();
    if (yaGiroHoy) {
      voz('giro-ya-giro');
      mostrarCartel('YA USASTE TUS GIROS', 'Revisá el contador para saber cuándo podés volver a participar', '#998d75');
      return;
    }
    girando = true; resolviendo = false;
    pintarBoton(false); btxt.text = '· · ·';
    sfx('ui-tap', 0.7);
    spinSound = sfx('spin-loop', 0.4, true);
    if (spinSound) { try { spinSound.preservesPitch = false; spinSound.playbackRate = 1; } catch (e) { console.warn(e); } }
    try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) { console.warn(e); }
    if (!vozDice('bienvenida')) voz('giro-suerte');
    arrancarRodillos();
    if (SRV) {
      try {
        const resp = await fetch(SRV.apiBase + '/api/loyalty/spin', {
          method: 'POST', headers: { Authorization: 'Bearer ' + SRV.token, 'x-kiosk-key': SRV.kioskKey },
        });
        const j = await resp.json();
        if (!resp.ok) throw new Error(j.error || 'spin rechazado');
        yaGiroHoy = j.left <= 0;
        girosRestantes = j.left;
        try { window.parent.postMessage({ tipo: 'giro-jugado', left: j.left, premio: j.premio ? j.premio.label : null }, '*'); } catch {}
        fijarResultado(j.premio
          ? { id: 'srv', label: j.premio.label.toUpperCase(), sym: j.premio.sym, kind: j.premio.kind }
          : { id: 'nada', label: 'SEGUÍ PARTICIPANDO', sym: null });
      } catch (err) {
        console.error('spin server:', err);
        fijarResultado({ id: 'error', label: '', sym: null });
      }
    } else {
      // DEMO standalone (forced outcomes only with ?demo=1&forzar=...)
      const n = giroDemoN++;
      const idF = FORZAR.length ? FORZAR[n % FORZAR.length] : null;
      // 'casi' = forced near-miss (nada with A A B on the forced row)
      // 'bonus' = forced bonus (scatter rows are random) · 'tease' = nada with logos on reels 1+2
      const esBonusDemo = bonusHabilitado && (idF === 'bonus' || (!idF && Math.random() < BONUS_PROB));
      const base = esBonusDemo ? { id: 'bonus', label: 'BONUS', sym: 'bonus', bonus: resolverBonus(null) }
        : idF === 'casi' ? Object.assign({}, PREMIOS.find(p => p.id === 'nada'), { casi: true })
        : idF === 'tease' ? Object.assign({}, PREMIOS.find(p => p.id === 'nada'), { tease: true })
        : ((idF && PREMIOS.find(p => p.id === idF)) || sortear());
      const premioDemo = Object.assign({}, base,
        LINEAS_F.length && !esBonusDemo ? { lineaForzada: LINEAS_F[n % LINEAS_F.length] } : {});
      fijarResultado(premioDemo);
      // kiosk demo mode (/kiosk?demo=1): report the spin so the parent keeps a fake balance
      // (a bonus spin is reported when the pick game ends, with its real prize)
      if (!esBonusDemo) {
        try {
          window.parent.postMessage({ tipo: 'giro-jugado', left: Math.max(0, GIROS_PERMITIDOS - girosUsados - 1),
            premio: premioDemo.id === 'nada' ? null : premioDemo.label }, '*');
        } catch {}
      }
    }
  });

  // ─── Rising anticipation sound (Web Audio; silent failure) ────────
  function iniciarRiser(dur) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const o = actx.createOscillator(), o2 = actx.createOscillator();
      const f = actx.createBiquadFilter(), g = actx.createGain();
      const lfo = actx.createOscillator(), lfoG = actx.createGain();
      o.type = 'sawtooth'; o2.type = 'triangle'; f.type = 'lowpass';
      o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(680, t + dur);
      o2.frequency.setValueAtTime(340, t); o2.frequency.exponentialRampToValueAtTime(1360, t + dur);
      f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(3200, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + dur * 0.85);
      lfo.frequency.setValueAtTime(5, t); lfo.frequency.linearRampToValueAtTime(14, t + dur);
      lfoG.gain.value = 0.025;
      lfo.connect(lfoG); lfoG.connect(g.gain);
      o.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
      [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 1.5); });
      riser = { g, osc: [o, o2, lfo] };
    } catch (e) { console.warn('riser', e); riser = null; }
  }
  function pararRiser() {
    if (!riser) return;
    try {
      const t = actx.currentTime;
      riser.g.gain.cancelScheduledValues(t);
      riser.g.gain.setValueAtTime(Math.max(0.0001, riser.g.gain.value), t);
      riser.g.gain.linearRampToValueAtTime(0, t + 0.08);
      riser.osc.forEach(x => x.stop(t + 0.1));
    } catch (e) { console.warn('riser stop', e); }
    riser = null;
  }

  // ─── Reel motion ─────────────────────────────────────────────────
  function iniciarFrenado(r, ahora) {
    // Final aligned position F: its 3 visible indices (F, F-1, F-2) are all
    // > floor(pos)+2, i.e. never drawn yet — safe to write the result there.
    const F = Math.floor(r.pos) + r.adelanto;
    for (let row = 0; row < ROWS; row++) r.strip.set(F - row, r.objetivo[row]);
    r.F = F; r.p0 = r.pos; r.v0 = r.vel; r.t0 = ahora;
    const D = F - r.pos;
    // constant deceleration from v0 to V_LLEGADA over distance D (velocity-continuous)
    r.T = 2 * D / (r.v0 + V_LLEGADA);
    r.acc = (r.v0 - V_LLEGADA) / r.T;
    r.estado = 'frenando';
  }
  function moverReel(r, ahora, dtS) {
    if (r.estado === 'windup') {
      const t = (ahora - r.t0) / 1000;
      if (t < 0) return;
      if (t < WIND_T) {
        // rise and come back: pos = p0 - A*sin²(πt/T) (zero speed at both ends)
        const s = Math.sin(Math.PI * t / WIND_T);
        r.pos = r.p0 - WIND_A * s * s;
        r.vel = -WIND_A * Math.PI / WIND_T * Math.sin(2 * Math.PI * t / WIND_T);
        return;
      }
      r.pos = r.p0; r.vel = 0;
      r.estado = 'girando';
      moverReel(r, ahora, (t - WIND_T));
      return;
    }
    if (r.estado === 'girando') {
      r.vel += (r.vObj - r.vel) * (1 - Math.exp(-ACEL_K * dtS));
      if (r.vel > V_MAX) r.vel = V_MAX;
      r.pos += r.vel * dtS;
      if (ahora >= r.stopAt && r.objetivo && r.vel > r.vObj * 0.8) iniciarFrenado(r, ahora);
      return;
    }
    if (r.estado === 'frenando') {
      const t = (ahora - r.t0) / 1000;
      if (t < r.T) {
        r.pos = r.p0 + r.v0 * t - 0.5 * r.acc * t * t;
        r.vel = r.v0 - r.acc * t;
        return;
      }
      r.estado = 'asentando'; r.t0 += r.T * 1000;
      aterrizar(r, ahora);
    }
    if (r.estado === 'asentando') {
      const t = (ahora - r.t0) / 1000;
      if (t >= RES_T) { r.pos = r.F; r.vel = 0; r.estado = 'quieto'; return; }
      const e = Math.exp(-RES_ZW * t), s = Math.sin(RES_WD * t), c = Math.cos(RES_WD * t);
      r.pos = r.F + (V_LLEGADA / RES_WD) * e * s;
      r.vel = V_LLEGADA * e * (c - (RES_ZW / RES_WD) * s);
    }
  }

  // The symbols hit the line: sound + squash + flash + sparks (+ anticipation)
  function aterrizar(r, ahora) {
    sfx('reel-stop', 1);
    for (let row = 0; row < ROWS; row++) {
      squash(r.pool[(((r.F - row) % POOL) + POOL) % POOL]);
      flash(r.cx, rowCenterY(row), 0.5);
    }
    chispas(r.cx, vent.y + vent.h - 14, LIVIANO ? 5 : 12);
    if (!resultado) return;
    const filaLogo = r.objetivo ? r.objetivo.indexOf('bonus') : -1;
    if (filaLogo >= 0) {
      // progressive scatter sound: 1st, 2nd, 3rd logo landed in this spin
      scatterN++;
      scatterFila[r.i] = filaLogo;
      const nombre = 'bonus-scatter-' + Math.min(3, scatterN);
      sfx(nombre, 1);
      scatterSonidos.push(nombre);
      flash(r.cx, rowCenterY(filaLogo), 1);
      if (scatterN === 3 && resultado.scatter) { scatter3En = ahora; pintarCajasCeldas(resultado.scatter); }
      chispas(r.cx, rowCenterY(filaLogo), LIVIANO ? 4 : 10);
    }
    if (r.i === COLS - 2 && (resultado.pares.length || resultado.anticipScatter)) {
      const last = reels[COLS - 1];
      last.vObj = V_ANTICIP; last.adelanto = 8;   // longer, more dramatic slow-down
      const dur = Math.max(0.8, (last.stopAt - ahora) / 1000 + 0.75);
      anticip = { desde: ahora, hasta: ahora + dur * 1000, pares: resultado.pares, fin: 0 };
      iniciarRiser(dur);
    }
    if (r.i === COLS - 1 && anticip) {
      pararRiser();
      anticip.fin = ahora;
      if (spinSound) { try { spinSound.playbackRate = 1; spinSound.volume = 0.4; } catch (e) { console.warn(e); } }
    }
  }

  // All reels settled: reveal the line, then the cartel (as v1)
  function resolverGiro() {
    resolviendo = true;
    girosUsados++;
    if (!SRV) { // server mode: lo fijó la respuesta del spin
      yaGiroHoy = girosUsados >= GIROS_PERMITIDOS;
      girosRestantes = Math.max(0, GIROS_PERMITIDOS - girosUsados);
    }
    if (spinSound) { spinSound.pause(); try { spinSound.playbackRate = 1; } catch (e) { console.warn(e); } spinSound = null; }
    pararRiser();
    const premio = window.__premio;
    const res = resultado;
    if (DEBUG) registrarGiro(res);
    const esBonusGiro = !!premio && premio.id === 'bonus' && !!res && !!res.scatter;
    const esGanador = esBonusGiro || (!!premio && premio.id !== 'nada' && premio.id !== 'error' && !!res && res.linea >= 0);
    const esTicket = !!premio && (premio.sym === 'lingote' || premio.kind === 'promo_ticket' || premio.id === 'ticket');
    let espera = 450;
    if (!premio || premio.id === 'error') espera = 0;
    if (esBonusGiro) {
      // no payline: glow boxes on the 3 logo cells, then the entrance
      const ahora = performance.now();
      festejo = { fila: -1, scatter: res.scatter, desde: ahora, hasta: ahora + 3600, lineaLista: true,
        sps: reels.map((r, i) => spriteEnFila(r, res.scatter[i])) };
      pintarCajasCeldas(res.scatter);
      // the BONUS voice + entrance hit ~0.65 s after scatter-3 starts (over its tail)
      setTimeout(() => iniciarBonus(premio), Math.max(0, scatter3En + BONUS_VOZ_DELAY_MS - ahora));
      return;
    }
    if (!esGanador) scatterFila.fill(-1);   // teased logos stay lit until the spin ends
    if (esGanador) {
      const ahora = performance.now();
      festejo = { fila: res.linea, desde: ahora, hasta: ahora + (esTicket ? 5200 : 3800), lineaLista: false,
        sps: reels.map(r => spriteEnFila(r, res.linea)) };
      pintarCajas(res.linea);
      sfx('win-gong', esTicket ? 1 : 0.85);
      if (esTicket) { sacudidaHasta = ahora + 700; sacudidaAmp = 9; }
      espera = esTicket ? 1100 : 1150;
    }
    setTimeout(() => terminarGiro(premio, esGanador, esTicket), espera);
  }
  function terminarGiro(premio, esGanador, esTicket) {
    girando = false; resolviendo = false;
    if (premio && premio.id !== 'error') pintarGiroLabel();
    btxt.text = 'GIRAR'; pintarBoton(true);
    if (!premio || premio.id === 'error') {
      mostrarCartel('SE CORTÓ LA CONEXIÓN', 'Tu giro NO se descontó — tocá GIRAR de nuevo', '#c9c0d0');
    } else if (premio.id !== 'nada') {
      mostrarCartel('¡GANASTE ' + premio.label + '!',
        esTicket ? 'Retiralo en la barra con tu DNI' : 'Ya están acreditados en tu cuenta', '#F0D275', esTicket);
      burst(esTicket ? 200 : 110);
      if (esTicket) {
        sfx('big-win', 1); // el stinger ya trae el grito BIG WIN — sin voz encima

        const vz = premio.esBonus ? premio.voz : (VOZ_SYM[premio.sym] || VOZ_PREMIO[premio.id]);
        if (vz) setTimeout(() => voz(vz), 500);
      }
      celebrarHasta = performance.now() + (esTicket ? 3500 : 2200);
      chipGanador = premio.esBonus ? null : (PREMIOS.find(p => p.sym === premio.sym) || premio).id;
    } else if (girosRestantes > 0) {
      // perdió pero le quedan giros: invitarlo a seguir YA
      mostrarCartel('SEGUÍ PARTICIPANDO',
        girosRestantes === 1 ? '¡Te queda 1 giro — probá de nuevo!' : `¡Te quedan ${girosRestantes} giros — probá de nuevo!`, '#c9c0d0');
      sfx('lose-soft', 0.7);
      setTimeout(() => voz('giro-nada-quedan'), 400);
    } else {
      // perdió el último de la ronda: suerte para la próxima
      mostrarCartel('SEGUÍ PARTICIPANDO', 'Volvé en un rato por tus próximos giros — ¡mucha suerte!', '#c9c0d0');
      sfx('lose-soft', 0.7);
      setTimeout(() => voz('giro-nada'), 400);
    }
    if (DEBUG) dbg.terminados++;
  }

  // ═══════════════════════════════════════════════════════════════
  //  BONUS · ELEGÍ TUS FICHAS (demo-only for now)
  //  Trigger: 3 Jackpoints logos as SCATTER (one per reel, any row).
  //  The prize is decided BEFORE the pick game by resolverBonus(); the
  //  board only PRESENTS it. Later the server will send it with the spin
  //  response and resolverBonus() will just map that answer.
  // ═══════════════════════════════════════════════════════════════
  const BONUS_IDLE_MS = 5000;         // idle → shimmer on the closed vases (no voice)
  const BONUS_AUTO_MS = 20000;        // idle → auto-pick one chip per second
  const BONUS_PREMIOS = [             // demo weights (sum = 100)
    { id: 'ticket2000', sym: 'lingote', label: 'TICKET $2.000', peso: 5,  voz: null, ticket: true, color: 0xFFD84A, casi: 'bonus-casi-ticket' },
    { id: 'ticket1000', sym: 'fenix',   label: 'TICKET $1.000', peso: 15, voz: null, ticket: true, color: 0x3CE09A, casi: 'bonus-casi-1000' },
    { id: 'pts500',     sym: 'gato',    label: '+500 PUNTOS',   peso: 35, voz: 'giro-500', color: 0xFF7A3C, casi: 'bonus-casi' },
    { id: 'pts250',     sym: 'koi',     label: '+250 PUNTOS',   peso: 45, voz: 'giro-250', color: 0x4ED4E0, casi: 'bonus-casi' },
  ];
  const COLOR_SYM = {}, CASI_SYM = {};
  BONUS_PREMIOS.forEach(p => { COLOR_SYM[p.sym] = p.color; CASI_SYM[p.sym] = p.casi; });
  const ORO = 0xF0D275;
  const TEX_GLOW_B = texturaRadial(0xFFFFFF);   // white glow: takes the tier tint

  // Single source of truth for the bonus prize. `respuesta` = future server
  // spin response ({ bonus: { id } }); demo = weighted random (or
  // &bonuspremio=ticket|1000|500|250 with ?demo=1 for testing).
  function resolverBonus(respuesta) {
    if (respuesta && respuesta.bonus) {
      const p = BONUS_PREMIOS.find(b => b.id === respuesta.bonus.id || b.sym === respuesta.bonus.sym);
      if (p) return p;
    }
    const f = DEMO_KIOSK ? PARAMS.get('bonuspremio') : null;
    if (f) {
      const alias = { ticket: 'ticket2000', '2000': 'ticket2000', '1000': 'ticket1000' };
      const p = BONUS_PREMIOS.find(b => b.id === (alias[f] || f) || b.id === 'pts' + f);
      if (p) return p;
    }
    let r = Math.random() * BONUS_PREMIOS.reduce((a, b) => a + b.peso, 0);
    for (const b of BONUS_PREMIOS) { r -= b.peso; if (r < 0) return b; }
    return BONUS_PREMIOS[BONUS_PREMIOS.length - 1];
  }

  function mezclar(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // The board holds 3 of each of the 4 symbols (12 chips). Picks reveal W
  // twice and every other symbol at most twice (always a rival pair for
  // tension), then the 3rd W — so W completes first whatever chip is tapped.
  // `resto` is what was left on the board (shown dimmed at the end).
  function secuenciaBonus(wSym) {
    const otros = mezclar(BONUS_PREMIOS.map(b => b.sym).filter(s => s !== wSym));
    const L = [5, 6, 6, 7][(Math.random() * 4) | 0];
    const previos = [wSym, wSym, otros[0], otros[0]];
    if (L >= 6) previos.push(otros[1]);
    if (L >= 7) previos.push(Math.random() < 0.5 ? otros[1] : otros[2]);
    mezclar(previos);
    // don't open with the W pair: let the rival show up first
    if (previos[0] === wSym && previos[1] === wSym) { const t = previos[1]; previos[1] = previos[2]; previos[2] = t; }
    const seq = previos.concat([wSym]);
    const cuenta = {};
    seq.forEach(s => { cuenta[s] = (cuenta[s] || 0) + 1; });
    const resto = [];
    BONUS_PREMIOS.forEach(b => { for (let i = cuenta[b.sym] || 0; i < 3; i++) resto.push(b.sym); });
    return { seq, resto: mezclar(resto) };
  }

  // ─── Bonus screen layout (logical px; kiosk 5:4 and 16:9) ─────────
  const BZ = CUADRADA
    ? { tituloY: 118, subY: 172, logoY: 46, leyY: 260, panelTop: 226, gridTop: 298, gridBot: 970, chipW: 200, gapX: 26, gapY: 16 }
    : { tituloY: 108, subY: 158, logoY: 40, leyY: 0, panelTop: 208, gridTop: 222, gridBot: 858, chipW: 182, gapX: 24, gapY: 16 };
  const B_COLS = 4, B_ROWS = 3, B_N = B_COLS * B_ROWS;
  const chipW = BZ.chipW;
  const chipH = Math.floor((BZ.gridBot - BZ.gridTop - BZ.gapY * (B_ROWS - 1)) / B_ROWS);
  const gridW = chipW * B_COLS + BZ.gapX * (B_COLS - 1);
  const gridX = (W - gridW) / 2;
  const panelPad = 24;

  const bonusLayer = new PIXI.Container();

  bonusLayer.pivot.set(W / 2, H / 2); bonusLayer.position.set(W / 2, H / 2);

  const panelH = BZ.gridBot + 14 - BZ.panelTop;
  const panelBg = spriteDe(canvasTex(gridW + panelPad * 2, panelH, (c) => {

  }), gridX - panelPad, BZ.panelTop);
  bonusLayer.addChild(panelBg);

  const BONUS_TITULO = 'BONUS · VASIJAS DE LA FORTUNA';

  const SUB_INICIAL = 'Destapá las vasijas · Encontrá tu tesoro';
  const bSub = new PIXI.Text(SUB_INICIAL, new PIXI.TextStyle({

  if (T.bonusLogo) {

    bLogo.height = CUADRADA ? 70 : 62; bLogo.scale.x = bLogo.scale.y;

  // ─── Legend: the 4 prize symbols ──────────────────────────────────
  const leyenda = [];
  BONUS_PREMIOS.forEach((p, i) => {
    const it = new PIXI.Container();
    const halo = new PIXI.Sprite(TEX_GLOW_B);
    halo.anchor.set(0.5); halo.blendMode = PIXI.BLEND_MODES.ADD; halo.alpha = 0; halo.tint = p.color;

      it.addChild(disco);

    const estiloBadge = new PIXI.TextStyle({ fontFamily: 'Georgia', fontSize: 17, fontWeight: '900', fill: '#FFE9A0' });
    const b23 = new PIXI.Text('2/3', estiloBadge); b23.anchor.set(0.5);

    it.badge = badge; it.b23 = b23; it.b33 = b33; it.badgeT0 = 0;
    it.halo = halo; it.ic = ic; it.icBase = ic.width; it.sym = p.sym;
