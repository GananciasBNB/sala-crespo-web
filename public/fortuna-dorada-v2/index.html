  // ─── Vases (fortune urns), drawn once on canvas → textures ──────
  // Body textures (one per seal character) + one lid texture. The game
  // only moves/tints sprites afterwards: nothing is allocated per frame.
  const SELLOS = ['福', '财', '喜'];   // fortune · wealth · joy
  const FUENTE_CJK = '"Microsoft YaHei", "SimSun", "MS Gothic", serif';
  const RIM_Y = 0.25;                  // vase mouth (fraction of chipH from the top)
  function bronce(c, x0, x1) {
    const g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#4a2a0c'); g.addColorStop(0.18, '#9a6524'); g.addColorStop(0.36, '#f7e39a');
    g.addColorStop(0.52, '#d6aa4e'); g.addColorStop(0.78, '#8c5a1c'); g.addColorStop(1, '#3e2208');
    return g;
  }
  function cuerpoVasija(c, w, h) {
    const cx = w / 2;
    c.beginPath();
    c.moveTo(cx - w * 0.15, h * 0.35);
    c.bezierCurveTo(cx - w * 0.47, h * 0.40, cx - w * 0.47, h * 0.80, cx - w * 0.20, h * 0.875);
    c.lineTo(cx + w * 0.20, h * 0.875);
    c.bezierCurveTo(cx + w * 0.47, h * 0.80, cx + w * 0.47, h * 0.40, cx + w * 0.15, h * 0.35);
    c.closePath();
  }
  function texVasija(sello) {
    const w = chipW, h = chipH;
    return canvasTex(w, h, (c) => {
      const cx = w / 2;
      // floor shadow
      c.fillStyle = 'rgba(0,0,0,0.45)';
      c.beginPath(); c.ellipse(cx, h * 0.935, w * 0.30, 7, 0, 0, Math.PI * 2); c.fill();
      // foot
      c.beginPath();
      c.moveTo(cx - w * 0.19, h * 0.86); c.lineTo(cx + w * 0.19, h * 0.86);
      c.lineTo(cx + w * 0.23, h * 0.93); c.lineTo(cx - w * 0.23, h * 0.93); c.closePath();
      c.fillStyle = bronce(c, cx - w * 0.23, cx + w * 0.23); c.fill();
      c.strokeStyle = 'rgba(60,30,6,0.8)'; c.lineWidth = 1.2; c.stroke();
      // neck
      c.beginPath();
      c.moveTo(cx - w * 0.17, h * RIM_Y); c.lineTo(cx + w * 0.17, h * RIM_Y);
      c.lineTo(cx + w * 0.14, h * 0.36); c.lineTo(cx - w * 0.14, h * 0.36); c.closePath();
      c.fillStyle = bronce(c, cx - w * 0.17, cx + w * 0.17); c.fill();
      // body + bands (clipped to the body)
      cuerpoVasija(c, w, h);
      c.fillStyle = bronce(c, cx - w * 0.42, cx + w * 0.42); c.fill();
      c.save();
      cuerpoVasija(c, w, h); c.clip();
      const brillo = c.createRadialGradient(cx - w * 0.15, h * 0.50, 2, cx - w * 0.15, h * 0.50, w * 0.32);
      brillo.addColorStop(0, 'rgba(255,248,215,0.55)'); brillo.addColorStop(1, 'rgba(255,248,215,0)');
      c.fillStyle = brillo; c.fillRect(0, 0, w, h);
      [h * 0.415, h * 0.80].forEach((y) => {
        c.fillStyle = '#5e0f1e'; c.fillRect(0, y - 6, w, 12);
        c.fillStyle = '#F0D275'; c.fillRect(0, y - 7, w, 1.6); c.fillRect(0, y + 5.4, w, 1.6);
        for (let x = 6; x < w; x += 13) { c.beginPath(); c.arc(x, y, 2, 0, Math.PI * 2); c.fill(); }
      });
      c.restore();
      cuerpoVasija(c, w, h); c.strokeStyle = 'rgba(60,30,6,0.85)'; c.lineWidth = 1.5; c.stroke();
      // red seal with the character
      const s = Math.min(w * 0.34, h * 0.2), sy = h * 0.61;
      c.save();
      c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
      roundRect(c, cx - s / 2, sy - s / 2, s, s, 6);
      const rojo = c.createLinearGradient(0, sy - s / 2, 0, sy + s / 2);
      rojo.addColorStop(0, '#d0202e'); rojo.addColorStop(1, '#8a0c16');
      c.fillStyle = rojo; c.fill();
      c.restore();
      roundRect(c, cx - s / 2 + 3, sy - s / 2 + 3, s - 6, s - 6, 4);
      c.strokeStyle = '#F0D275'; c.lineWidth = 1.6; c.stroke();
      c.fillStyle = '#FFE9A0'; c.font = `700 ${Math.round(s * 0.66)}px ${FUENTE_CJK}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(sello, cx, sy + 1);
      // rim + dark mouth (covered by the lid until it opens)
      c.beginPath(); c.ellipse(cx, h * RIM_Y, w * 0.185, 7, 0, 0, Math.PI * 2);
      c.fillStyle = '#F0D275'; c.fill();
      c.beginPath(); c.ellipse(cx, h * RIM_Y, w * 0.15, 4.5, 0, 0, Math.PI * 2);
      c.fillStyle = '#1a0806'; c.fill();
    });
  }
  const LID_W = Math.round(chipW * 0.46), LID_H = Math.round(chipH * 0.2);
  const texTapa = canvasTex(LID_W, LID_H, (c) => {
    const cx = LID_W / 2, base = LID_H * 0.8;
    c.beginPath(); c.ellipse(cx, base, LID_W * 0.46, LID_H * 0.5, 0, Math.PI, 0); c.closePath();
    c.fillStyle = bronce(c, cx - LID_W * 0.46, cx + LID_W * 0.46); c.fill();
    c.strokeStyle = 'rgba(60,30,6,0.85)'; c.lineWidth = 1.3; c.stroke();
    c.fillStyle = '#5e0f1e'; c.fillRect(cx - LID_W * 0.40, base - LID_H * 0.2, LID_W * 0.8, 4);
    c.beginPath(); c.ellipse(cx, base, LID_W * 0.48, 5, 0, 0, Math.PI * 2);
    c.fillStyle = '#F0D275'; c.fill(); c.stroke();
    // knob
    c.beginPath(); c.arc(cx, LID_H * 0.2, LID_H * 0.15, 0, Math.PI * 2);
    const pomo = c.createRadialGradient(cx - 2, LID_H * 0.15, 1, cx, LID_H * 0.2, LID_H * 0.15);
    pomo.addColorStop(0, '#fff4c8'); pomo.addColorStop(1, '#b8862e');
    c.fillStyle = pomo; c.fill(); c.stroke();
  });
  const texVasijas = SELLOS.map(texVasija);
  const MOUTH_Y = chipH * RIM_Y - chipH / 2;          // mouth, in vase-local coords
  const SYM_Y = chipH * 0.06;                          // symbol rests in front of the body
  const OPEN_MS = 600;
  // dark wine/black disc with a thin gold ring + soft shadow: the revealed
  // symbol must read at a glance in front of the (receded) gold vase
  const DISCO_D = Math.round(Math.min(chipW, chipH) * 0.86), DISCO_PAD = 12;
  const texDisco = canvasTex(DISCO_D + DISCO_PAD * 2, DISCO_D + DISCO_PAD * 2, (c) => {
    const m = DISCO_D / 2 + DISCO_PAD, r = DISCO_D / 2;
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.75)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
    const g = c.createRadialGradient(m, m - r * 0.2, r * 0.1, m, m, r);
    g.addColorStop(0, '#4a1020'); g.addColorStop(0.65, '#1c060c'); g.addColorStop(1, '#070203');
    c.beginPath(); c.arc(m, m, r, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.restore();
    c.beginPath(); c.arc(m, m, r - 2, 0, Math.PI * 2); c.strokeStyle = '#F0D275'; c.lineWidth = 2.2; c.stroke();
    c.beginPath(); c.arc(m, m, r - 7, 0, Math.PI * 2); c.strokeStyle = 'rgba(240,210,117,0.3)'; c.lineWidth = 1; c.stroke();
  });
  const DISCO_ESC = 1 / CV_RES;

  const chipsLayer = new PIXI.Container();
  bonusLayer.addChild(chipsLayer);
  const fichas = [];
  for (let i = 0; i < B_N; i++) {
    const ch = new PIXI.Container();
    ch.position.set(gridX + (chipW + BZ.gapX) * (i % B_COLS) + chipW / 2,
                    BZ.gridTop + (chipH + BZ.gapY) * ((i / B_COLS) | 0) + chipH / 2);
    // aura: tap flash · pair pulse · winning trio
    const ring = new PIXI.Sprite(TEX_GLOW_B);
    ring.anchor.set(0.5); ring.width = chipW * 1.6; ring.height = chipH * 1.4; ring.tint = ORO;
    ring.alpha = 0; ring.blendMode = PIXI.BLEND_MODES.ADD;
    const body = new PIXI.Sprite(texVasijas[i % SELLOS.length]);
    body.anchor.set(0.5); body.scale.set(1 / CV_RES);
    const shine = new PIXI.Sprite(TEX_GLOW);
    shine.anchor.set(0.5); shine.width = chipW * 0.8; shine.height = chipH * 0.6; shine.y = chipH * 0.1;
    shine.blendMode = PIXI.BLEND_MODES.ADD; shine.alpha = 0;
    const lid = new PIXI.Sprite(texTapa);
    lid.anchor.set(0.5, 0.8); lid.scale.set(1 / CV_RES);
    const lidY0 = MOUTH_Y + 2;
    const symHalo = new PIXI.Sprite(TEX_GLOW_B); symHalo.tint = ORO;
    symHalo.anchor.set(0.5); symHalo.blendMode = PIXI.BLEND_MODES.ADD; symHalo.alpha = 0;
    symHalo.width = symHalo.height = Math.min(chipW, chipH) * 1.05; symHalo.y = SYM_Y;
    const faceSym = new PIXI.Sprite(T.lingote); faceSym.anchor.set(0.5); faceSym.visible = false;
    const symTam = Math.min(chipW, chipH) * 0.72;
    const disco = new PIXI.Sprite(texDisco);
    disco.anchor.set(0.5); disco.scale.set(DISCO_ESC); disco.y = SYM_Y; disco.alpha = 0;
    ch.addChild(ring, body, shine, lid, symHalo, disco, faceSym);
    ch.hitArea = new PIXI.Rectangle(-chipW / 2, -chipH / 2, chipW, chipH);
    ch.eventMode = 'static'; ch.cursor = 'pointer';
    Object.assign(ch, { idx: i, ring, body, disco, lid, lidY0, lidDir: 1, symHalo, faceSym, shine, symTam,
      estado: 'tapada', sym: null, tPress: 0, tFlip: 0, tPop: 0, tRing: 0, sonoReveal: false,
      par: false, gana: false, apagada: false, silenciosa: false });
    ch.on('pointerdown', () => tocarFicha(ch, false));
    chipsLayer.addChild(ch); fichas.push(ch);
  }
  function resetVasija(ch) {
    ch.estado = 'tapada'; ch.sym = null; ch.par = ch.gana = ch.apagada = ch.silenciosa = ch.sonoReveal = false;
    ch.tPress = ch.tFlip = ch.tPop = ch.tRing = 0;
    ch.alpha = 1; ch.scale.set(1); ch.ring.alpha = 0; ch.shine.alpha = 0;
    ch.body.tint = 0xFFFFFF; ch.body.alpha = 1; ch.disco.alpha = 0; ch.disco.scale.set(DISCO_ESC);
    ch.ring.tint = ORO; ch.symHalo.tint = ORO;
    ch.lid.position.set(0, ch.lidY0); ch.lid.rotation = 0; ch.lid.alpha = 1;
    ch.faceSym.visible = false; ch.symHalo.alpha = 0;
  }
  // assigns the symbol and starts the opening (lid pops, symbol rises)
  function abrirVasija(ch, sym, inicio) {
    ch.sym = sym;
    ch.faceSym.texture = T[sym]; ch.faceSym.width = ch.faceSym.height = ch.symTam * 0.35;
    ch.lidDir = Math.random() < 0.5 ? -1 : 1;
    ch.estado = 'girando'; ch.tFlip = inicio; ch.sonoReveal = false;
  }

  const HILO_N = 16;
  const hilosLayer = new PIXI.Container();
  bonusLayer.addChild(hilosLayer);
  const hilos = [];
  for (let i = 0; i < 3; i++) {
    const g = new PIXI.Graphics(); g.visible = false; g.blendMode = PIXI.BLEND_MODES.ADD;
    hilosLayer.addChild(g);
    const dots = [];
    for (let j = 0; j < HILO_N; j++) {
      const d = new PIXI.Sprite(TEX_GLOW_B);
      d.anchor.set(0.5); d.blendMode = PIXI.BLEND_MODES.ADD; d.visible = false;
      hilosLayer.addChild(d); dots.push(d);
    }
    hilos.push({ g, dots, activo: false, t0: 0, ax: 0, ay: 0, bx: 0, by: 0, cx: 0, cy: 0 });
  }
  // arc bowed towards the top of the screen, drawn once per pair
  function crearHilo(a, b, sym, ahora) {
    const h = hilos.find(x => !x.activo);
    if (!h) return;
    h.activo = true; h.t0 = ahora;
    h.ax = a.x; h.ay = a.y + SYM_Y; h.bx = b.x; h.by = b.y + SYM_Y;
    const dx = h.bx - h.ax, dy = h.by - h.ay, L = Math.hypot(dx, dy) || 1;
    let nx = dy / L, ny = -dx / L;
    if (ny > 0) { nx = -nx; ny = -ny; }
    const bow = Math.min(110, L * 0.25);
    h.cx = (h.ax + h.bx) / 2 + nx * bow; h.cy = (h.ay + h.by) / 2 + ny * bow;
    const col = COLOR_SYM[sym] || ORO;
    const g = h.g;
    g.clear();
    g.lineStyle(16, col, 0.16).moveTo(h.ax, h.ay).quadraticCurveTo(h.cx, h.cy, h.bx, h.by);
    g.lineStyle(6, ORO, 0.5).moveTo(h.ax, h.ay).quadraticCurveTo(h.cx, h.cy, h.bx, h.by);
    g.lineStyle(2, 0xFFF4C8, 0.95).moveTo(h.ax, h.ay).quadraticCurveTo(h.cx, h.cy, h.bx, h.by);
    g.visible = true; g.alpha = 0;
    h.dots.forEach((d, j) => { d.tint = j % 3 === 0 ? 0xFFFFFF : col; d.visible = true; d.alpha = 0; });
  }
  function apagarHilos() {
    hilos.forEach(h => { h.activo = false; h.g.visible = false; h.dots.forEach(d => { d.visible = false; }); });
  }

  // Sparkle pool (no allocations while the bonus runs)
  const bChispas = [];
  for (let i = 0; i < 48; i++) {
    const p = new PIXI.Sprite(TEX_GLOW);
    p.anchor.set(0.5); p.blendMode = PIXI.BLEND_MODES.ADD; p.visible = false;
    p.vx = 0; p.vy = 0; p.vida = 0;
    bonusLayer.addChild(p); bChispas.push(p);
  }
  let bChispaIdx = 0;
  function chispasFicha(x, y, n) {
    for (let i = 0; i < n; i++) {
      const p = bChispas[bChispaIdx]; bChispaIdx = (bChispaIdx + 1) % bChispas.length;
      const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6;
      p.visible = true; p.vida = 1; p.alpha = 1;
      p.width = p.height = 8 + Math.random() * 14;
      p.position.set(x + Math.cos(a) * chipW * 0.25, y + Math.sin(a) * chipH * 0.25);
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - 2.5;
    }
  }

  // ─── Entrance: big Jackpoints logo over the reels ─────────────────
  const intro = new PIXI.Container();
  intro.visible = false;
  intro.position.set(W / 2, rowCenterY(1) - 30);
  const introLogo = new PIXI.Sprite(T.bonusLogo || T.logo);
  introLogo.anchor.set(0.5); introLogo.width = CUADRADA ? 600 : 540; introLogo.scale.y = introLogo.scale.x;
  const introTxt = new PIXI.Text('¡BONUS!', new PIXI.TextStyle({
    fontFamily: 'Georgia', fontSize: 92, fontWeight: '900',
    fill: ['#ffffff', '#F0D275', '#c9a84c'], fillGradientStops: [0.2, 0.6, 1], letterSpacing: 8,
    stroke: '#4a0b17', strokeThickness: 8,
    dropShadow: true, dropShadowColor: '#000', dropShadowBlur: 18, dropShadowDistance: 6,
  }));
  introTxt.anchor.set(0.5); introTxt.y = introLogo.height / 2 + 30;
  intro.addChild(introLogo, introTxt);
  app.stage.addChild(intro);

  // reels-screen elements that fade out while the bonus board is up
  const capasJuego = [ventBg, reelLayer, sombra, marco, ...badges, anticipGlow, cajasG, lineaG, boton, giroLabel, tablaLayer];
  const RAYOS_POS_X = rayos.x, RAYOS_POS_Y = rayos.y;

  function iniciarBonus(premioGiro) {
    const ahora = performance.now();
    const premio = premioGiro.bonus || resolverBonus(null);
    const { seq, resto } = secuenciaBonus(premio.sym);
    bonus = { fase: 'entrada', t0: ahora, premio, seq, resto, n: 0, cuentas: {},
      ultimoToque: ahora, autoUlt: 0, otraDicha: false, casiDichas: 0, completo: false,
      restoIni: false, restoN: 0, elegi: 'espera', tElegi: 0 };
    if (DEBUG) {
      dbg.bonus = dbg.bonus || [];
      dbg.bonusActual = { W: premio.id, wSym: premio.sym, seq: seq.slice(), reveladas: [], maxOtrosAntesDeW: 0, autoPicks: 0, ok: null };
      dbg.bonus.push(dbg.bonusActual);
    }
    fichas.forEach(resetVasija);
    apagarHilos();
    leyenda.forEach(it => { it.badge.visible = false; it.badgeT0 = 0; });
    bonusMusicaOn = true;
    leyenda.forEach(it => { it.halo.alpha = 0; it.ic.width = it.ic.height = it.icBase; });
    bSub.text = SUB_INICIAL;
    // the logos pulse harder for the entrance
    if (festejo) { festejo.amp = 0.22; festejo.hasta = ahora + 2600; }
    fogonazo.alpha = 0.85;
    sacudidaHasta = ahora + 600; sacudidaAmp = 8;
    rayos.position.set(W / 2, rowCenterY(1));
    voz(BONUS_VOZ_ENTRADA);
    intro.visible = true; intro.alpha = 1; intro.scale.set(0);
    chispas(W / 2, rowCenterY(1), LIVIANO ? 8 : 24);
  }

  function tocarFicha(ch, auto) {
    const b = bonus;
    if (!b || b.fase !== 'picks' || b.completo || ch.estado !== 'tapada') return;
    const ahora = performance.now();
    if (!auto) b.ultimoToque = ahora;
    else {
      // auto-picks keep the kiosk session alive too
      try { window.parent.postMessage({ tipo: 'actividad' }, '*'); } catch {}
      if (DEBUG && dbg.bonusActual) dbg.bonusActual.autoPicks++;
    }
    const sym = b.seq[b.n++];
    if (b.n >= b.seq.length) b.completo = true;   // no more taps: the trio is on its way
    abrirVasija(ch, sym, ahora + 90);
    ch.tPress = ahora; ch.tRing = ahora;
    sfx('bonus-flip', 0.8);
    chispasFicha(ch.x, ch.y + MOUTH_Y, LIVIANO ? 4 : 10);   // golden puff from the lid
  }

  function fichaRevelada(ch, ahora) {
    ch.estado = 'abierta'; ch.tPop = ahora;
    const b = bonus;
    if (ch.silenciosa) return;   // leftovers at the end: no counting, no sounds
    const c = (b.cuentas[ch.sym] || 0) + 1;
    b.cuentas[ch.sym] = c;
    const W_SYM = b.premio.sym;
    if (DEBUG && dbg.bonusActual) {
      dbg.bonusActual.reveladas.push(ch.sym);
      if (!(b.cuentas[W_SYM] >= 3)) {
        for (const k in b.cuentas) if (k !== W_SYM && b.cuentas[k] > dbg.bonusActual.maxOtrosAntesDeW) dbg.bonusActual.maxOtrosAntesDeW = b.cuentas[k];
      }
    }
    if (c === 2) {
      sfx('bonus-pair', 0.75);
      const col = COLOR_SYM[ch.sym] || ORO;
      let otra = null;
      fichas.forEach(f => {
        if (f.estado === 'abierta' && f.sym === ch.sym && !f.silenciosa) {
          f.par = true; f.ring.tint = col; f.symHalo.tint = col;
          if (f !== ch) otra = f;
        }
      });
      if (otra) crearHilo(otra, ch, ch.sym, ahora);
      const it = leyenda.find(x => x.sym === ch.sym);
      if (it) it.badgeT0 = ahora;
      // ticket / 1000 pairs get their own line; 500 / 250 the generic one (60%)
      const vozCasi = CASI_SYM[ch.sym] || 'bonus-casi';
      const personal = vozCasi !== 'bonus-casi';
      if (b.casiDichas < 2 && (personal || Math.random() < 0.6) && !vozDice('bonus-elegi')) {
        b.casiDichas++;
        setTimeout(() => { if (bonus === b && b.fase === 'picks' && !vozDice('bonus-elegi')) voz(vozCasi); }, 280);
      }
    }
    if (ch.sym === W_SYM && c === 3) {
      b.fase = 'resuelto'; b.t0 = ahora;
      sfx('bonus-trio', 0.5);
      apagarHilos();
      const itW = leyenda.find(x => x.sym === W_SYM);
      if (itW) itW.badgeT0 = ahora;
      const colW = COLOR_SYM[W_SYM] || ORO;
      fichas.forEach(f => {
        if (f.estado === 'abierta' && f.sym === W_SYM) {
          f.gana = true; f.par = false; f.ring.tint = colW; f.symHalo.tint = colW;
          chispasFicha(f.x, f.y + SYM_Y, LIVIANO ? 4 : 10);
        }
        else { f.par = false; if (f.estado === 'abierta') f.apagada = true; }   // trio stands out
      });
      bSub.text = '¡3 IGUALES! GANASTE ' + b.premio.label;
      if (DEBUG && dbg.bonusActual) {
        const cu = b.cuentas;
        dbg.bonusActual.ok = cu[W_SYM] === 3 && Object.keys(cu).every(k => k === W_SYM || cu[k] <= 2);
        dbg.bonusActual.cuentas = Object.assign({}, cu);
      }
    }
  }

  function terminarBonusPremio(b) {
    const p = b.premio;
    const premioFinal = { id: 'bonus-' + p.id, label: p.label, sym: p.sym, esBonus: true, voz: p.voz };
    window.__premio = premioFinal;
    // kiosk demo: the spin is reported once its real prize is known
    try {
      window.parent.postMessage({ tipo: 'giro-jugado', left: Math.max(0, GIROS_PERMITIDOS - girosUsados), premio: p.label }, '*');
    } catch {}
    if (p.ticket) { sacudidaHasta = performance.now() + 700; sacudidaAmp = 9; }
    try { const tr = audioDe(SFX_DIR2 + 'bonus-trio.mp3'); if (!tr.paused) tr.volume = 0.12; } catch (e) { console.warn(e); }
    terminarGiro(premioFinal, true, !!p.ticket);
  }

  function finalizarBonus() {
    bonus = null;
    bonusMusicaOn = false;
    apagarHilos();
    bonusLayer.visible = false; bonusLayer.alpha = 0;
    capasJuego.forEach(o => { o.alpha = 1; });
    intro.visible = false; bonusRayos = 0;
    rayos.position.set(RAYOS_POS_X, RAYOS_POS_Y);
    bChispas.forEach(p => { p.visible = false; });
    scatterFila.fill(-1);
  }

  const BONUS_MUSICA_VOL = 0.32, MUSICA_JUEGO_VOL = 0.3, MUSICA_FADE_S = 0.6, MUSICA_XF_S = 1.2;
  const bMus = DEMO_KIOSK ? [audioDe(SFX_DIR2 + 'bonus-musica.mp3'), audioDe(SFX_DIR2 + 'bonus-musica.mp3?b')] : [];
  let gBonus = 0, gJuego = 1, gDuck = 1, bmCur = 0, bmXf = -1, bmIniciada = false;
  function arrancarPista(a) {
    try {
      a.loop = false; a.volume = 0; a.currentTime = 0;
      const p = a.play();
      if (p) p.catch(e => console.warn('bonus musica:', e && e.name));
    } catch (e) { console.warn('bonus musica', e); }
  }
  function mezclaMusica(dtMs) {
    const paso = dtMs / 1000 / MUSICA_FADE_S;
    gJuego = bonusMusicaOn ? Math.max(0, gJuego - paso) : Math.min(1, gJuego + paso);
    gBonus = bonusMusicaOn ? Math.min(1, gBonus + paso) : Math.max(0, gBonus - paso);
    if (musica) musica.volume = MUSICA_JUEGO_VOL * gJuego;
    if (!bMus.length) return;
    if (gBonus <= 0) {
      if (bmIniciada) { bMus.forEach(a => { if (!a.paused) a.pause(); }); bmIniciada = false; bmXf = -1; bmCur = 0; }
      return;
    }
    const hablando = !!vozActual && !vozActual.paused && !vozActual.ended;
    gDuck += ((hablando ? 0.6 : 1) - gDuck) * Math.min(1, dtMs / 150);
    let a = bMus[bmCur], o = bMus[1 - bmCur];
    if (!bmIniciada) { bmIniciada = true; arrancarPista(a); }
    else if (bmXf < 0 && a.ended) arrancarPista(a);   // no duration known: plain restart
    // seamless loop: start the twin copy before the end and crossfade
    if (bmXf < 0 && a.duration > MUSICA_XF_S * 3 && a.currentTime > a.duration - MUSICA_XF_S) { bmXf = 0; arrancarPista(o); }
    let wa = 1, wo = 0;
    if (bmXf >= 0) {
      bmXf += dtMs / 1000;
      const k = Math.min(1, bmXf / MUSICA_XF_S);
      wa = 1 - k; wo = k;
      if (k >= 1) { a.pause(); bmCur = 1 - bmCur; bmXf = -1; const t = a; a = o; o = t; wa = 1; wo = 0; }
    }
    const v = BONUS_MUSICA_VOL * gBonus * gDuck;
    a.volume = Math.max(0, Math.min(1, v * wa));
    o.volume = Math.max(0, Math.min(1, v * wo));
  }

  const easeOutBack = (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

  function bonusTick(ahora, dt) {
    const b = bonus;
    const t = ahora - b.t0;
    if (b.fase === 'entrada') {
      // 0-600 flash + rays + logos pulse · 500-1100 big logo pops · hold · 2600 transition
      bonusRayos = Math.min(1, t / 300);
      const k = Math.min(1, Math.max(0, (t - 500) / 600));
      intro.scale.set(k > 0 ? easeOutBack(k) * (1 + 0.03 * Math.sin(ahora / 160)) : 0);
      if (t >= 2600) {
        b.fase = 'transicion'; b.t0 = ahora;
        bonusLayer.visible = true;
      }
    } else if (b.fase === 'transicion') {
      const k = Math.min(1, t / 600);
      const e = k * k * (3 - 2 * k);
      capasJuego.forEach(o => { o.alpha = 1 - e; });
      intro.alpha = 1 - e; intro.scale.set(1 + e * 0.5);
      bonusRayos = 1 - e;
      bonusLayer.alpha = e; bonusLayer.scale.set(0.9 + 0.1 * e);
      if (k >= 1) {
        intro.visible = false; bonusRayos = 0;
        rayos.position.set(RAYOS_POS_X, RAYOS_POS_Y);
        b.fase = 'picks'; b.t0 = ahora; b.ultimoToque = ahora;
        b.elegi = 'espera';   // "bonus-elegi" plays once the BONUS voice is over
      }
    } else if (b.fase === 'picks') {
      if (b.elegi === 'espera' && !vozDice(BONUS_VOZ_ENTRADA)) {
        b.elegi = 'sonando'; b.tElegi = ahora; voz('bonus-elegi');
      } else if (b.elegi === 'sonando' && ((!vozDice('bonus-elegi') && ahora - b.tElegi > 300) || ahora - b.tElegi > 9000)) {
        // idle (5 s) and autopick (20 s) timers start when the line is over
        b.elegi = 'listo'; if (b.ultimoToque < ahora) b.ultimoToque = ahora;
      }
      const idle = b.elegi === 'listo' ? ahora - b.ultimoToque : 0;
      if (!b.completo && idle > BONUS_AUTO_MS && ahora - b.autoUlt >= 1000) {
        b.autoUlt = ahora;
        let libres = 0;
        for (let i = 0; i < B_N; i++) if (fichas[i].estado === 'tapada') libres++;
        let elegida = (Math.random() * libres) | 0;
        for (let i = 0; i < B_N; i++) {
          if (fichas[i].estado === 'tapada' && elegida-- === 0) { tocarFicha(fichas[i], true); break; }
        }
      }
    } else if (b.fase === 'resuelto') {
      // highlight the trio · then show what was left (dimmed) · then the cartel
      if (!b.restoIni && t >= 1400) {
        b.restoIni = true;
        let j = 0;
        for (let i = 0; i < B_N; i++) {
          const f = fichas[i];
          if (f.estado !== 'tapada') continue;
          f.silenciosa = true; f.apagada = true;
          abrirVasija(f, b.resto[j], ahora + j * 110);
          f.tPress = 0; f.tRing = 0;
          j++;
        }
        b.restoN = j;
      }
      if (b.restoIni && t >= 1400 + b.restoN * 110 + 900) {
        b.fase = 'cartel'; b.t0 = ahora;
        terminarBonusPremio(b);
      }
    } else if (b.fase === 'cartel') {
      if (t >= (b.premio.ticket ? 4200 : 3200)) { b.fase = 'salida'; b.t0 = ahora; bonusMusicaOn = false; }
    } else if (b.fase === 'salida') {
      const k = Math.min(1, t / 600);
      bonusLayer.alpha = 1 - k;
      capasJuego.forEach(o => { o.alpha = k; });
      if (k >= 1) { finalizarBonus(); return; }
    }

    // ─── vases ───
    const brillo = b.fase === 'picks' && !b.completo && b.elegi === 'listo' && (ahora - b.ultimoToque) > BONUS_IDLE_MS;
    for (let i = 0; i < B_N; i++) {
      const ch = fichas[i];
      let sx = 1, sy = 1;
      if (ch.estado === 'tapada') {
        ch.shine.alpha = brillo ? 0.22 + 0.25 * Math.sin(ahora / 170 - i * 0.7)
                                : 0.04 + 0.04 * Math.sin(ahora / 900 + i);
        if (brillo) { const s = 1 + 0.025 * Math.sin(ahora / 170 - i * 0.7); sx = sy = s; }
      } else if (ch.estado === 'girando') {
        if (ahora < ch.tFlip) {
          // press-down squash before the lid pops
          const kp = ch.tPress ? Math.min(1, (ahora - ch.tPress) / 90) : 0;
          sx = 1 + 0.06 * kp; sy = 1 - 0.1 * kp;
        } else {
          const k = Math.min(1, (ahora - ch.tFlip) / OPEN_MS);
          const rb = Math.sin(Math.PI * Math.min(1, k * 2.5));
          sx = 1 - 0.03 * rb; sy = 1 + 0.05 * rb;
          ch.shine.alpha = 0;
          // lid lifts off, spins away and fades
          const kl = Math.min(1, k / 0.7);
          ch.lid.y = ch.lidY0 - chipH * 0.3 * (1 - (1 - kl) * (1 - kl));
          ch.lid.x = ch.lidDir * chipW * 0.38 * kl;
          ch.lid.rotation = ch.lidDir * 1.4 * kl;
          ch.lid.alpha = kl < 0.5 ? 1 : 1 - (kl - 0.5) / 0.5;
          // the symbol floats out of the mouth (up, then settles in front)
          const ks = Math.max(0, (k - 0.2) / 0.8);
          if (ks > 0) {
            ch.faceSym.visible = true;
            ch.faceSym.y = MOUTH_Y + (SYM_Y - MOUTH_Y) * ks - chipH * 0.16 * Math.sin(Math.PI * ks);
            ch.faceSym.width = ch.faceSym.height = ch.symTam * (0.35 + 0.65 * ks + 0.18 * Math.sin(Math.PI * ks));
            ch.faceSym.alpha = Math.min(1, ks * 3);
            ch.symHalo.alpha = 0.5 * ks;
            ch.body.alpha = 1 - 0.6 * ks;
            if (ks > 0.4) ch.body.tint = 0x5E4C46;
            const kd = Math.min(1, Math.max(0, (ks - 0.35) / 0.4));
            ch.disco.alpha = kd; ch.disco.scale.set(DISCO_ESC * (0.6 + 0.4 * kd));
          }
          if (!ch.sonoReveal && ks >= 0.35) {
            ch.sonoReveal = true;
            if (!ch.silenciosa) { sfx('bonus-reveal', 0.6); chispasFicha(ch.x, ch.y + SYM_Y, LIVIANO ? 3 : 8); }
          }
          if (k >= 1) { ch.lid.alpha = 0; fichaRevelada(ch, ahora); }
        }
      } else {
        // open: the symbol bobs gently in front of its vase
        const kp = Math.min(1, (ahora - ch.tPop) / 260);
        let s = 1 + 0.1 * Math.sin(Math.PI * kp);
        if (ch.gana) s *= 1 + 0.07 * Math.sin(ahora / 120);
        ch.faceSym.width = ch.faceSym.height = ch.symTam * s;
        ch.faceSym.y = SYM_Y + 3 * Math.sin(ahora / 420 + i);
        ch.symHalo.alpha = ch.gana ? 0.8 + 0.2 * Math.sin(ahora / 90) : ch.par ? 0.6 + 0.35 * Math.sin(ahora / 140) : 0.3;
        if (ch.apagada) ch.alpha += (0.42 - ch.alpha) * Math.min(1, 0.12 * dt);
      }
      ch.scale.set(sx, sy);
      // aura: tap flash · pulsing pair · winning trio
      let ra = 0;
      if (ch.tRing) {
        const kr = (ahora - ch.tRing) / 420;
        if (kr < 1) ra = 0.8 * (1 - kr); else ch.tRing = 0;
      }
      if (ch.gana) ra = Math.max(ra, 0.85 + 0.15 * Math.sin(ahora / 90));
      else if (ch.par) ra = Math.max(ra, 0.65 + 0.35 * Math.sin(ahora / 140));
      ch.ring.alpha = ra;
    }
    // legend: pair → glow, winner → pulse
    for (let i = 0; i < leyenda.length; i++) {
      const it = leyenda[i];
      const c = b.cuentas[it.sym] || 0;
      let a = 0, s = 1;
      if (c >= 3) { a = 0.8 + 0.2 * Math.sin(ahora / 90); s = 1 + 0.1 * Math.sin(ahora / 120); }
      else if (c === 2) { a = 0.55 + 0.3 * Math.sin(ahora / 140); s = 1 + 0.05 * Math.sin(ahora / 140); }
      it.halo.alpha += (a - it.halo.alpha) * 0.2;
      it.ic.width = it.ic.height = it.icBase * s;
      if (c >= 2 && it.badgeT0) {
        it.badge.visible = true; it.b23.visible = c === 2; it.b33.visible = c >= 3;
        const kb = Math.min(1, (ahora - it.badgeT0) / 320);
        it.badge.scale.set(Math.max(0, easeOutBack(kb)) * (1 + 0.06 * Math.sin(ahora / 150)));
      } else it.badge.visible = false;
    }
    // energy threads: particles flow along the arc between the pair
    for (let i = 0; i < hilos.length; i++) {
      const h = hilos[i];
      if (!h.activo) continue;
      const k = Math.min(1, (ahora - h.t0) / 350);
      h.g.alpha = k * (0.6 + 0.3 * Math.sin(ahora / 120));
      for (let j = 0; j < HILO_N; j++) {
        const d = h.dots[j];
        const u = (ahora / 1100 + j / HILO_N) % 1, v = 1 - u;
        d.x = v * v * h.ax + 2 * v * u * h.cx + u * u * h.bx;
        d.y = v * v * h.ay + 2 * v * u * h.cy + u * u * h.by;
        const e = Math.sin(Math.PI * u);
        d.alpha = k * e;
        d.width = d.height = 10 + 12 * e;
      }
    }
    // sparkles
    for (let i = 0; i < bChispas.length; i++) {
      const p = bChispas[i];
      if (!p.visible) continue;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.22 * dt;
      p.vida -= 0.028 * dt; p.alpha = p.vida;
      if (p.vida <= 0) p.visible = false;
    }
  }

  if (DEBUG) {
    window.__fdBonus = () => bonus ? {
      fase: bonus.fase, W: bonus.premio.id, wSym: bonus.premio.sym, seq: bonus.seq, n: bonus.n,
      cuentas: Object.assign({}, bonus.cuentas), completo: bonus.completo,
      fichas: fichas.map(f => ({ x: f.x, y: f.y, w: chipW, h: chipH, estado: f.estado, sym: f.sym })),
    } : null;
  }

  // ─── DEBUG instrumentation (&debug=1) ────────────────────────────
  const dbg = { frames: 0, cambiosTexturaVisibles: 0, reasignacionesVisibles: 0, asignacionesEnVentana: 0,
    saltosPos: 0, maxExcesoPos: 0, maxDeltaCeldas: 0, maxDeltaVel: 0, incoherenciasY: 0,
    giros: [], terminados: 0, frameMs: [], muestras: [], saltosDetalle: [] };
  if (DEBUG) {
    window.__fdDebug = dbg;
    window.__fdGirar = () => { ocultarCartel(); boton.emit('pointertap'); };
    window.__fdEstado = () => ({ girando, resolviendo, estados: reels.map(r => r.estado),
      pos: reels.map(r => r.pos), vel: reels.map(r => r.vel), anticip: !!(anticip && !anticip.fin) });
  }
  function registrarGiro(res) {
    const visto = reels.map(r => [0, 1, 2].map(row => spriteEnFila(r, row).sym));
    const texOk = reels.every((r, i) => [0, 1, 2].every(row => spriteEnFila(r, row).texture === T[visto[i][row]]));
    const filasGanadorasVistas = [];
    for (let row = 0; row < ROWS; row++) {
      if (visto[0][row] === visto[1][row] && visto[1][row] === visto[2][row]) filasGanadorasVistas.push(row);
    }
    dbg.giros.push({ premio: res && res.premio.id, sym: res && res.sym, linea: res ? res.linea : -1,
      anticipacion: !!(res && (res.pares.length || res.anticipScatter)), pares: res ? res.pares : [],
      scatter: res ? res.scatter : null, logosPorReel: visto.map(col => col.filter(s => s === 'bonus').length),
      sonidosScatter: scatterSonidos.slice(),
      esperado: res ? res.g : null, visto, texOk,
      coincide: !!res && JSON.stringify(res.g) === JSON.stringify(visto), filasGanadorasVistas,
      posFinal: reels.map(r => r.pos) });
  }
  let dbgPrevAhora = 0;
  function debugFrame(ahora) {
    dbg.frames++;
    const dt = dbgPrevAhora ? (ahora - dbgPrevAhora) / 1000 : 0;
    dbgPrevAhora = ahora;
    if (dbg.frameMs.length < 50000) dbg.frameMs.push(app.ticker.deltaMS);
    dbg.asignacionesEnVentana = dbgAsignVisibles;
    for (const r of reels) {
      if (r._pp !== undefined && dt > 0) {
        const d = r.pos - r._pp;
        const lim = Math.max(Math.abs(r.vel), Math.abs(r._pv)) * dt * 1.1 + 0.004;
        const exceso = Math.abs(d) / lim;
        if (exceso > dbg.maxExcesoPos) dbg.maxExcesoPos = exceso;
        if (exceso > 1) {
          dbg.saltosPos++;
          if (dbg.saltosDetalle.length < 40) dbg.saltosDetalle.push({ reel: r.i, estado: r.estado, d, lim, dt, vel: r.vel, pv: r._pv });
        }
        if (Math.abs(d) > dbg.maxDeltaCeldas) dbg.maxDeltaCeldas = Math.abs(d);
        const dv = Math.abs(r.vel - r._pv);
        if (dv > dbg.maxDeltaVel) dbg.maxDeltaVel = dv;
      }
      for (const sp of r.pool) {
        const vis = sp.k !== null && celdaVisible(r.pos, sp.k);
        if (vis && sp._pvis) {
          if (sp.texture !== sp._pt) dbg.cambiosTexturaVisibles++;
          if (sp.k !== sp._pk) dbg.reasignacionesVisibles++;
          else if (Math.abs((sp.y - sp._py) - (r.pos - r._pp) * CELL_H) > 0.01) dbg.incoherenciasY++;
        }
        sp._pvis = vis; sp._pt = sp.texture; sp._pk = sp.k; sp._py = sp.y;
      }
      r._pp = r.pos; r._pv = r.vel;
    }
    if (girando && dbg.muestras.length < 20000 && (dbg.frames % 2 === 0)) {
      dbg.muestras.push([Math.round(ahora), ...reels.map(r => +r.pos.toFixed(4)), ...reels.map(r => +r.vel.toFixed(3))]);
    }
  }

  // Vigila el fps real los primeros segundos: si la PC no llega (gabinetes
  // con video integrado viejo), apaga video de fondo, blur y motas en caliente.
  let fpsFrames = 0, fpsDesde = performance.now(), fpsMedido = false, segundaMedicion = false;
  function vigilarFps(ahora) {
    if (fpsMedido || LIVIANO) return;
    fpsFrames++;
    const transcurrido = ahora - fpsDesde;
    if (transcurrido < 4000) return;
    fpsMedido = true;
    const fps = fpsFrames / (transcurrido / 1000);
    if (DEBUG) dbg.fpsVigilado = fps;
    if (fps >= 26) return;
    if (segundaMedicion) {
      // ya se apago todo lo caro y sigue lento: ultimo recurso, menos pixeles
      console.log('Fortuna Dorada: ' + fps.toFixed(1) + ' fps -> bajando resolucion');
      recordarMaquinaLenta(2);
      try { app.renderer.resolution = 0.75; app.renderer.resize(W, H); fit(); } catch (e) { console.warn(e); }
      return;
    }
    LIVIANO = true;
    recordarMaquinaLenta(1);
    console.log('Fortuna Dorada: ' + fps.toFixed(1) + ' fps -> modo liviano');
    try { if (videoFondo) videoFondo.pause(); } catch {}
    fondo.texture = T.fondo;
    fondo.scale.set(Math.max(W / T.fondo.width, H / T.fondo.height));
    reels.forEach(r => { r.cont.filters = null; });
    motas.forEach((m, i) => { if (i >= 12) m.visible = false; });
    // se vuelve a medir: si ni asi alcanza, ahi si se resigna nitidez
    fpsFrames = 0; fpsDesde = performance.now(); fpsMedido = false; segundaMedicion = true;
  }

  let ultimoTick = performance.now();
  // Bonus screen: hide the game header (logo + 3 lines) and make the bonus title blink
  app.ticker.add(() => {
    const enBonus = bonusLayer.visible;
    const hdr = enBonus ? 1 - bonusLayer.alpha : 1;
    logo.alpha = t1.alpha = t2.alpha = t3.alpha = hdr;
    if (enBonus) {
      const f = performance.now() / 1000;
      bTitulo.alpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(f * 5.5));
      bTitulo.scale.set(1 + 0.03 * Math.sin(f * 2.75));
    } else if (bTitulo.alpha !== 1) { bTitulo.alpha = 1; bTitulo.scale.set(1); }
  });
  app.ticker.add(() => {
    const ahora = performance.now();
    vigilarFps(ahora);
    const dt = Math.min(app.ticker.deltaMS / 16.667, 4);
    // reels integrate with the same clock as their analytic phases (capped)
    const dtS = Math.min((ahora - ultimoTick) / 1000, 0.066);
    ultimoTick = ahora;
    tablaTick(ahora);

    let algunoGirando = false;
    for (let i = 0; i < COLS; i++) {
      const r = reels[i];
      if (r.estado !== 'quieto') { algunoGirando = true; moverReel(r, ahora, dtS); }
      dibujarReel(r);
      // motion blur proportional to speed (px per frame)
      r.blur.blurY = Math.min(26, Math.abs(r.vel) * CELL_H / 60 * 0.38);
    }
    if (DEBUG) debugFrame(ahora);
    if (girando && !resolviendo && !algunoGirando && resultado) resolverGiro();
    if (bonus) bonusTick(ahora, dt);
    mezclaMusica(app.ticker.deltaMS);

    // ─── Anticipation: glow on the last reel + rising spin sound ───
    if (anticip && !anticip.fin) {
      const k = Math.min(1, (ahora - anticip.desde) / (anticip.hasta - anticip.desde));
      anticipGlow.alpha = Math.min(1, (ahora - anticip.desde) / 250) * (0.65 + 0.35 * Math.sin(ahora / 70));
      if (spinSound) { try { spinSound.playbackRate = 1 + 0.45 * k; spinSound.volume = Math.min(1, 0.4 + 0.5 * k); } catch (e) { console.warn(e); } }
    } else if (anticipGlow.alpha > 0) {
      anticipGlow.alpha = Math.max(0, anticipGlow.alpha - 0.06 * dt);
    }

    // ─── Winning payline: drawn left→right, then pulsing ───────────
    if (festejo) {
      const t = ahora - festejo.desde;
      if (festejo.fila >= 0) {
        if (t < 420) pintarLinea(festejo.fila, t / 420);
        else if (!festejo.lineaLista) { pintarLinea(festejo.fila, 1); festejo.lineaLista = true; }
      }
      const vivo = ahora < festejo.hasta;
      const pul = vivo ? 0.7 + 0.3 * Math.sin(ahora / 95) : 0.55;
      // marco.alpha < 1 while the bonus board is up (reels screen faded out)
      lineaG.alpha = cajasG.alpha = pul * marco.alpha;
      for (let i = 0; i < festejo.sps.length; i++) {
        const sp = festejo.sps[i];
        const s = vivo ? 1 + (festejo.amp || 0.085) * Math.sin(ahora / 140 - i * 0.6) : 1;
        sp.width = sp.height = SYM_SIZE * s;
      }
      for (const b of badges) {
        if (b.row === festejo.fila) b.glow.alpha = vivo ? 0.6 + 0.4 * Math.sin(ahora / 95) : 0.4;
      }
    }

    // ─── Ticket: screen shake + gold flash + rays ───────────────────
    if (ahora < sacudidaHasta) {
      const k = (sacudidaHasta - ahora) / 700;
      app.stage.position.set((Math.random() - 0.5) * sacudidaAmp * k, (Math.random() - 0.5) * sacudidaAmp * k);
    } else if (app.stage.x !== 0 || app.stage.y !== 0) app.stage.position.set(0, 0);
    if (fogonazo.alpha > 0) fogonazo.alpha = Math.max(0, fogonazo.alpha - 0.03 * dt);
    const rayosCartel = cartelTicket && cartel.visible;
    rayos.visible = rayosCartel || bonusRayos > 0;
    if (rayos.visible) {
      rayos.rotation += 0.006 * dt;
      rayos.alpha = (0.75 + 0.25 * Math.sin(ahora / 300)) * (rayosCartel ? 1 : bonusRayos);
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.esMoneda) {
        // moneda: cae con gravedad suave y "flipea" sobre su eje
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.12 * dt;
        p.rotation += p.rot * dt;
        p.flip += p.flipVel * dt;
        p.width = Math.max(2, Math.abs(Math.cos(p.flip)) * p.tam);
        if (p.y > H + 80) { app.stage.removeChild(p); p.destroy(); parts.splice(i, 1); }
        continue;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.55 * dt; p.rotation += p.rot * dt; p.vida -= 0.011 * dt; p.alpha = p.vida;
      if (p.vida <= 0) { app.stage.removeChild(p); p.destroy(); parts.splice(i, 1); }
    }

    // ─── FONDO VIVO: brasas + respiración ────────────────────────
    for (const m of motas) {
      m.y -= m.vy * dt;
      m.sway += 0.008 * dt;
      m.x += Math.sin(m.sway) * 0.25 * dt;
      if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
    }
    respiro.alpha = 0.045 + 0.025 * Math.sin(ahora / 950);

    // ─── Cell halos: idle breathing / near-miss pair / win ─────────
    for (let i = 0; i < COLS; i++) {
      const r = reels[i];
      for (let row = 0; row < ROWS; row++) {
        const h = halos[i][row];
        let a = 0;
        if (festejo && (row === festejo.fila || (festejo.scatter && festejo.scatter[i] === row))) {
          a = ahora < festejo.hasta ? 0.55 + 0.3 * Math.sin(ahora / 110 + i) : 0.3;
          h.width = h.height = SYM_SIZE * (1.55 + 0.2 * Math.sin(ahora / 220 + i));
        } else if (scatterFila[i] === row) {
          a = 0.6 + 0.25 * Math.sin(ahora / 130 + i);   // landed logo: stays lit until the spin ends
        } else if (anticip && !anticip.fin && i < COLS - 1 && anticip.pares.indexOf(row) >= 0) {
          a = 0.45 + 0.3 * Math.sin(ahora / 80);
        } else if (r.estado === 'quieto' && !girando && !festejo) {
          a = 0.12 + 0.06 * Math.sin(ahora / 620 + i * 1.4 + row);
        }
        h.alpha += (a - h.alpha) * 0.2;
      }
    }

    // ─── Tweens de impacto (squash / flash) ──────────────────────
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; tw.t += app.ticker.deltaMS;
      const k = Math.min(1, tw.t / tw.dur);
      if (tw.tipo === 'squash') {
        // aplasta y vuelve con resorte amortiguado
        let sy;
        if (k < 0.3) sy = 1 - 0.12 * (k / 0.3);
        else sy = 1 + 0.12 * Math.sin((k - 0.3) * 9) * (1 - k);
        tw.sp.height = SYM_SIZE * sy;
        tw.sp.width = SYM_SIZE * (1 + (1 - sy) * 0.55);
        if (k >= 1) { tw.sp.width = tw.sp.height = SYM_SIZE; tweens.splice(i, 1); }
      } else if (tw.tipo === 'flash') {
        tw.sp.alpha = tw.sp.a0 * (1 - k);
        tw.sp.width = tw.sp.height = SYM_SIZE * (1.3 + k * 0.6);
        if (k >= 1) { reelLayer.removeChild(tw.sp); tw.sp.destroy(); tweens.splice(i, 1); }
      }
    }
    if (!girando && !yaGiroHoy) boton.scale.set(1 + Math.sin(ahora / 420) * 0.02);
    else boton.scale.set(1);
  });
 } catch (err) {
   mostrarErrorPantalla((err && err.message ? err.message : String(err)) + (err && err.stack ? ' · ' + String(err.stack).split('\n')[1] : ''));
 }
}).catch(e => mostrarErrorPantalla(e && e.message ? e.message : String(e)));
</script>
</body>
