<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Gran Pesca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #020814; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #juego { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  canvas { display: block; }
  #cargando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f0d275; font: 32px 'Lilita One', sans-serif; letter-spacing: 1px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script src="plan.js"></script>
</head>
<body>
<div id="cargando">Cargando…</div>
<div id="juego"></div>
<script>
// ════════════════════════════════════════════════════════════════════════════
// La Gran Pesca — 30-second skill game for the Jackpoints kiosk (demo build).
// Drag the boat, catch leaping fish with the net, avoid the junk.
// Everyone gets the same "rain" of the night (seeded), so the ranking is fair.
// ════════════════════════════════════════════════════════════════════════════
const W = 1280, H = 1024
const IMG = 'img/', SFX = 'sfx/'
const params = new URLSearchParams(location.search)
const DURACION = Number(params.get('segundos')) || 30
const FUENTE = "'Lilita One', 'Arial Rounded MT Bold', sans-serif"

// ── seeded random: same sequence for everyone on the same night ────────────
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function semillaDeHoy() {
  const ar = new Date(Date.now() - 3 * 3600e3 - 4 * 3600e3) // sala day: changes at 04:00 AR
  return Number(`${ar.getUTCFullYear()}${String(ar.getUTCMonth() + 1).padStart(2, '0')}${String(ar.getUTCDate()).padStart(2, '0')}`)
}
let SEMILLA = Number(params.get('semilla')) || semillaDeHoy()
// inside the kiosk: attempts, the night's seed and the ranking come from the server through the parent page
const KIOSCO = params.get('kiosco') === '1' && window.parent !== window
let pedidoId = 0
const esperas = {}
let estadoKiosco = null   // { mejorHoy, intentosQuedan, proximoIntento }
addEventListener('message', (e) => {
  const d = e.data || {}
  if (d.respuestaPesca && esperas[d.id]) { esperas[d.id](d); delete esperas[d.id] }
  else if (d.tipo === 'pesca-estado') { estadoKiosco = d; if (typeof window.__refrescarMenu === 'function') window.__refrescarMenu() }
})
function pedirAlKiosco(tipo, datos = {}) {
  return new Promise(res => {
    const id = ++pedidoId
    esperas[id] = res
    parent.postMessage({ tipo, id, ...datos }, '*')
    setTimeout(() => { if (esperas[id]) { delete esperas[id]; res({ ok: false, error: 'sin_respuesta' }) } }, 15000)
  })
}
const horaCorta = iso => new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
// time left to the next attempt: "2:14:05" or "14:05"
function cuentaRegresiva(iso) {
  const s = Math.max(0, Math.ceil((new Date(iso).getTime() - Date.now()) / 1000))
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(seg).padStart(2, '0')
}
const sinIntentos = () => KIOSCO && estadoKiosco && estadoKiosco.intentosQuedan === 0 && estadoKiosco.proximoIntento

// ── tiny tween engine ───────────────────────────────────────────────────────
const E = {
  lin: t => t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) },
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
}
let tweens = []
function tween(obj, props, dur, ease = E.outCubic, delay = 0) {
  return new Promise(res => {
    const from = {}
    for (const k in props) from[k] = k === 'scale' ? obj.scale.x : obj[k]
    tweens.push({ obj, props, from, dur: Math.max(1, dur), ease, t: -delay, res })
  })
}
function correrTweens(ms) {
  for (const tw of tweens) {
    if (tw.obj.destroyed) { tw.done = true; continue }   // destroyed meanwhile: just finish it
    tw.t += ms
    if (tw.t < 0) continue
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p)
    for (const k in tw.props) {
      const v = tw.from[k] + (tw.props[k] - tw.from[k]) * e
      if (k === 'scale') tw.obj.scale.set(v); else tw.obj[k] = v
    }
    if (p >= 1) tw.done = true
  }
  const listos = tweens.filter(t => t.done); tweens = tweens.filter(t => !t.done)
  for (const t of listos) t.res()
}
const espera = ms => new Promise(r => setTimeout(r, ms))

// ── sound: files in sfx/ (generated with ElevenLabs). Missing files stay silent ──
const Sonido = {
  ctx: null, buffers: {}, musica: null, musicaGain: null, ambiente: null,
  async iniciar() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)()
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination)
      const nombres = ['salto', 'cae-agua', 'atrapa', 'atrapa-plata', 'atrapa-dorado', 'atrapa-legendario', 'basura', 'racha',
        'cuenta', 'ya', 'ultimos10', 'tiempo', 'conteo', 'record', 'tap', 'ambiente', 'musica-juego', 'musica-menu',
        'voz-3', 'voz-2', 'voz-1', 'voz-ya', 'voz-dorado', 'voz-legendario', 'voz-racha', 'voz-ultimos10', 'voz-tiempo', 'voz-record', 'voz-top2', 'voz-top3', 'voz-instrucciones']
      await Promise.all(nombres.map(async n => {
        try {
          const r = await fetch(SFX + n + '.mp3'); if (!r.ok) return
          this.buffers[n] = await this.ctx.decodeAudioData(await r.arrayBuffer())
        } catch (e) { console.warn('sonido', n, e.message) }
      }))
    } catch (e) { console.warn('audio no disponible', e) }
  },
  // browsers start audio only after a touch: the first tap starts the lake ambience and the menu music
  desbloquear() {
    try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume() } catch (e) { console.warn(e) }
    if (!this.ambiente && this.buffers.ambiente) this.ambiente = this.loop('ambiente', .55)
    if (!this.musica && this.alDesbloquear) this.alDesbloquear()
  },
  tocar(n, vol = 1, rate = 1) {
    const b = this.buffers[n]; if (!b || !this.ctx) return null
    try {
      const s = this.ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = rate
      const g = this.ctx.createGain(); g.gain.value = vol; s.connect(g); g.connect(this.master); s.start()
      return { s, g }
    } catch (e) { console.warn(e); return null }
  },
  loop(n, vol) {
    const b = this.buffers[n]; if (!b || !this.ctx) return null
    try {
      const s = this.ctx.createBufferSource(); s.buffer = b; s.loop = true
      const g = this.ctx.createGain(); g.gain.value = 0; s.connect(g); g.connect(this.master); s.start()
      g.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.8)
      return { s, g }
    } catch (e) { console.warn(e); return null }
  },
  apagar(h, seg = 0.6) {
    if (!h || !this.ctx) return
    try { h.g.gain.cancelScheduledValues(this.ctx.currentTime); h.g.gain.setValueAtTime(h.g.gain.value, this.ctx.currentTime); h.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + seg); h.s.stop(this.ctx.currentTime + seg + 0.05) } catch (e) { console.warn(e) }
  },
  musicaDe(n, vol = 0.55) { this.apagar(this.musica); this.musica = this.loop(n, vol) },
  // voice over music: duck the music for a moment
  voz(n) {
    const h = this.tocar(n, 1); if (!h || !this.musica) return h
    try { const g = this.musica.g.gain, t = this.ctx.currentTime, v = g.value; g.cancelScheduledValues(t); g.setValueAtTime(v, t); g.linearRampToValueAtTime(v * 0.45, t + 0.08); g.linearRampToValueAtTime(v, t + h.s.buffer.duration + 0.15) } catch (e) { console.warn(e) }
    return h
  },
}

// ── app + fit to any screen (letterbox, 1280x1024 logical) ──────────────────
const app = new PIXI.Application({ width: W, height: H, backgroundColor: 0x020814, antialias: true, resolution: 1, powerPreference: 'high-performance' })
document.getElementById('juego').appendChild(app.view)
function encajar() {
  const s = Math.min(innerWidth / W, innerHeight / H)
  const el = document.getElementById('juego')
  el.style.transform = `scale(${s}) translate(-50%, -50%)`
  el.style.width = W + 'px'; el.style.height = H + 'px'
}
addEventListener('resize', encajar); encajar()

// ── textures drawn in code (particles, glows, water noise) ─────────────────
function texCanvas(size, dibujar) { const c = document.createElement('canvas'); c.width = c.height = size; dibujar(c.getContext('2d'), size); return PIXI.Texture.from(c) }
const TX = {
  glow: texCanvas(256, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s) }),
  gota: texCanvas(48, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.28, 'rgba(225,244,255,.95)'); r.addColorStop(.5, 'rgba(160,215,255,.35)'); r.addColorStop(1, 'rgba(160,215,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s) }),
  espuma: texCanvas(96, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(235,248,255,.85)'); r.addColorStop(.6, 'rgba(200,230,255,.25)'); r.addColorStop(1, 'rgba(200,230,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s) }),
  chispa: texCanvas(96, (g, s) => {
    const c = s / 2, gl = g.createRadialGradient(c, c, 0, c, c, c); gl.addColorStop(0, 'rgba(255,255,255,1)'); gl.addColorStop(.2, 'rgba(255,240,190,.6)'); gl.addColorStop(1, 'rgba(255,220,120,0)'); g.fillStyle = gl; g.fillRect(0, 0, s, s)
    g.fillStyle = '#fff'; for (const [w, h] of [[s * .06, s * .5], [s * .5, s * .06]]) { g.beginPath(); g.ellipse(c, c, w, h, 0, 0, Math.PI * 2); g.fill() }
  }),
  ruido: texCanvas(256, (g, s) => {
    g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, s, s)
    const rnd = mulberry32(7)
    for (let i = 0; i < 160; i++) { const x = rnd() * s, y = rnd() * s, r = 10 + rnd() * 40, v = rnd() > .5 ? 255 : 0; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${v},${255 - v},128,.35)`); gr.addColorStop(1, 'rgba(128,128,128,0)'); for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) { g.save(); g.translate(dx, dy); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore() } }
  }),
}

// ── text helper ─────────────────────────────────────────────────────────────
function texto(str, size, opts = {}) {
  const t = new PIXI.Text(str, new PIXI.TextStyle({
    fontFamily: FUENTE, fontSize: size, fill: opts.fill || ['#fff6cf', '#f0c24a'], fillGradientStops: [0.2, 1],
    stroke: opts.stroke || '#2a1606', strokeThickness: opts.borde ?? Math.round(size / 7), align: 'center', letterSpacing: opts.esp ?? 1,
    dropShadow: opts.sombra ?? true, dropShadowColor: '#000', dropShadowAlpha: .55, dropShadowBlur: 6, dropShadowDistance: Math.round(size / 14), dropShadowAngle: Math.PI / 2,
    lineJoin: 'round', wordWrap: !!opts.ancho, wordWrapWidth: opts.ancho || 0,
  }))
  t.anchor.set(0.5)
  return t
}

// ════════════════════════════════════════════════════════════════════════════
async function main() {
  try { await document.fonts.load(`40px 'Lilita One'`) } catch (e) { console.warn('fuente', e) }
  const M = await (await fetch(IMG + 'manifest.json')).json()
  const nombres = ['pescador-quieto', 'pescador-red', 'pescador-festeja', 'pescador-uhno', 'bote', 'pez-comun', 'pez-plateado', 'pez-dorado', 'pez-legendario',
    'basura-botella', 'basura-bota', 'basura-rama', 'logo', 'fondo-cielo', 'fondo-cerros', 'fondo-orilla', 'fondo-agua', 'fondo-juncos',
    'ui-reloj', 'ui-puntaje', 'ui-insignia', 'ui-boton', 'ui-tarjeta']
  const T = {}
  if (M['pescador-izq']) nombres.push('pescador-izq')
  await Promise.all(nombres.map(async n => { T[n] = await PIXI.Assets.load(IMG + n + '.webp') }))
  Sonido.iniciar()   // loads in the background; the game never waits for audio
  document.getElementById('cargando').remove()

  // ── scene ──────────────────────────────────────────────────────────────────
  const mundo = new PIXI.Container(); app.stage.addChild(mundo)
  const hud = new PIXI.Container(); app.stage.addChild(hud)
  const pantallas = new PIXI.Container(); app.stage.addChild(pantallas)
  const capa = (tex, y, factor) => { const s = new PIXI.Sprite(tex); s.scale.set(W / tex.width * (factor || 1)); s.y = y; s.x = (W - s.width) / 2; return s }

  const cieloC = new PIXI.Container(); mundo.addChild(cieloC)
  const cielo = capa(T['fondo-cielo'], -18, 1.04); cieloC.addChild(cielo)
  const lunaX = cielo.x + cielo.width * 0.845, lunaY = cielo.y + cielo.height * 0.2
  const lunaGlow = new PIXI.Sprite(TX.glow); lunaGlow.anchor.set(.5); lunaGlow.position.set(lunaX, lunaY); lunaGlow.tint = 0xdfe8ff; lunaGlow.blendMode = PIXI.BLEND_MODES.ADD; lunaGlow.alpha = .35; lunaGlow.scale.set(1.6); cieloC.addChild(lunaGlow)
  const estrellas = []
  { const rnd = mulberry32(99); for (let i = 0; i < 46; i++) { const e = new PIXI.Sprite(TX.chispa); e.anchor.set(.5); let x, y; do { x = rnd() * W; y = 20 + rnd() * 300 } while (Math.hypot(x - lunaX, y - lunaY) < 150); e.position.set(x, y); e.scale.set(.06 + rnd() * .12); e.blendMode = PIXI.BLEND_MODES.ADD; e.fase = rnd() * 6.28; e.vel = .8 + rnd() * 2.2; cieloC.addChild(e); estrellas.push(e) } }

  const cerros = capa(T['fondo-cerros'], -60, 1.06); mundo.addChild(cerros)
  const orillaC = new PIXI.Container(); mundo.addChild(orillaC)
  const orilla = capa(T['fondo-orilla'], 22, 1.06); orillaC.addChild(orilla)
  const cabana = new PIXI.Sprite(TX.glow); cabana.anchor.set(.5); cabana.tint = 0xffb050; cabana.blendMode = PIXI.BLEND_MODES.ADD
  cabana.position.set(orilla.x + orilla.width * 0.205, orilla.y + orilla.height * 0.775); cabana.scale.set(.32); cabana.alpha = .55; orillaC.addChild(cabana)

  const aguaC = new PIXI.Container(); mundo.addChild(aguaC)
  const agua = capa(T['fondo-agua'], 548, 1.08); aguaC.addChild(agua)
  const ruido = new PIXI.Sprite(TX.ruido); ruido.texture.baseTexture.wrapMode = PIXI.WRAP_MODES.REPEAT; ruido.scale.set(2.2); ruido.renderable = false; aguaC.addChild(ruido)
  const ondas = new PIXI.DisplacementFilter(ruido); ondas.scale.set(14, 6); agua.filters = [ondas]

  const fxAtras = new PIXI.Container(); mundo.addChild(fxAtras)       // ripples and wake under the boat
  const AGUA_Y = 868                                                  // waterline of the boat
  const bote = new PIXI.Container(); mundo.addChild(bote)
  const fxItems = new PIXI.Container(); mundo.addChild(fxItems)       // fish / junk
  const fxFrente = new PIXI.Container(); mundo.addChild(fxFrente)     // splashes, sparkles, score pops
  const juncos = capa(T['fondo-juncos'], H - T['fondo-juncos'].height * (W / T['fondo-juncos'].width) * 1.04 + 70, 1.04); mundo.addChild(juncos)
  const luciernagas = []
  { const rnd = mulberry32(5); for (let i = 0; i < 16; i++) { const l = new PIXI.Sprite(TX.glow); l.anchor.set(.5); l.tint = 0xd8ff7a; l.blendMode = PIXI.BLEND_MODES.ADD; const izq = i % 2 === 0; l.base = { x: izq ? 30 + rnd() * 230 : W - 30 - rnd() * 230, y: 700 + rnd() * 280 }; l.fase = rnd() * 6.28; l.scale.set(.05 + rnd() * .05); mundo.addChild(l); luciernagas.push(l) } }

  // ── boat + fisherman (4 aligned poses, cross-faded) ─────────────────────────
  const ESC_BOTE = 0.43, ESC_PESC = 0.42
  const pescC = new PIXI.Container(); bote.addChild(pescC)
  const P = M.pescador
  const poses = {}
  for (const k of ['quieto', 'red', 'festeja', 'uhno', ...(T['pescador-izq'] ? ['izq'] : [])]) {
    const s = new PIXI.Sprite(T['pescador-' + k]); s.anchor.set(P.asiento[0] / P.w, P.asiento[1] / P.h); s.alpha = k === 'quieto' ? 1 : 0; pescC.addChild(s); poses[k] = s
  }
  pescC.scale.set(ESC_PESC); pescC.position.set(-28, -12)
  const casco = new PIXI.Sprite(T['bote']); casco.anchor.set(.5, .52); casco.scale.set(ESC_BOTE); bote.addChild(casco)
  const farol = new PIXI.Sprite(TX.glow); farol.anchor.set(.5); farol.tint = 0xffa040; farol.blendMode = PIXI.BLEND_MODES.ADD
  farol.position.set(-casco.width * 0.445, -casco.height * 0.18); farol.scale.set(.75); farol.alpha = .7; bote.addChild(farol)
  // net hoop position relative to the boat (from the manifest anchors)
  // the boat's rim (relative to bote): items that fall on it bounce off
  const BORDE_BOTE = { ancho: casco.width * .44, y: -48 }
  const ARO = { x: pescC.x + (P.aro[0] - P.asiento[0]) * ESC_PESC, y: pescC.y + (P.aro[1] - P.asiento[1]) * ESC_PESC, r: P.aro[2] * ESC_PESC }
  const aroBrillo = new PIXI.Sprite(TX.glow); aroBrillo.anchor.set(.5); aroBrillo.position.set(ARO.x, ARO.y); aroBrillo.tint = 0xfff1b0; aroBrillo.blendMode = PIXI.BLEND_MODES.ADD; aroBrillo.alpha = 0; aroBrillo.scale.set(.75); bote.addChild(aroBrillo)

  if (params.get('debug')) { const dbg = new PIXI.Graphics(); dbg.lineStyle(3, 0x00ff88, .9).drawCircle(ARO.x, ARO.y, 66); bote.addChild(dbg) }
  let poseActual = 'quieto', poseHasta = 0, miraIzq = false
  function pose(nombre, ms = 0) {
    if (nombre !== poseActual) {
      const vieja = poses[poseActual], nueva = poses[nombre]
      tween(nueva, { alpha: 1 }, 70, E.outQuad); tween(vieja, { alpha: 0 }, 110, E.outQuad, 30)
      poseActual = nombre
      // squash and settle: reads as one continuous motion instead of an image swap
      pescC.scale.set(ESC_PESC * 1.035, ESC_PESC * 0.965)
      tweenEsc(pescC, ESC_PESC, 260)
    }
    poseHasta = ms ? performance.now() + ms : 0
  }
  function tweenEsc(obj, objetivo, dur) {
    const sx = obj.scale.x, sy = obj.scale.y, t0 = performance.now()
    const paso = () => { if (obj.destroyed) return; const p = Math.min(1, (performance.now() - t0) / dur), e = E.outBack(p); obj.scale.set(sx + (objetivo - sx) * e, sy + (objetivo - sy) * e); if (p < 1) requestAnimationFrame(paso) }
    requestAnimationFrame(paso)
  }

  // ── boat control: follows the finger with spring inertia ───────────────────
  const RADIO_ATRAPE = 66
  const MIN_X = 330, MAX_X = W - ARO.x - 90   // inside the reeds: the fisherman is never hidden
  let boteX = W / 2, boteV = 0, objetivoX = W / 2, controlActivo = false
  app.stage.eventMode = 'static'; app.stage.hitArea = new PIXI.Rectangle(0, 0, W, H)
  const mover = e => { if (controlActivo) objetivoX = Math.max(MIN_X, Math.min(MAX_X, e.global.x)) }
  app.stage.on('pointerdown', e => {
    Sonido.desbloquear(); mover(e)
    if (KIOSCO) parent.postMessage({ tipo: 'actividad' }, '*')   // keeps the kiosk session alive while playing
  })
  app.stage.on('pointermove', mover)

  // ── particles (pooled) ──────────────────────────────────────────────────────
  const pool = []; let particulas = []
  let calidad = 1   // drops to 0.5 if the cabinet struggles
  function particula(tex, capaDestino, x, y, o) {
    const p = pool.pop() || new PIXI.Sprite(tex)
    p.muerta = false   // recycled sprite: without this it froze on screen forever
    p.texture = tex; p.anchor.set(.5); p.position.set(x, y); p.alpha = o.alpha ?? 1; p.tint = o.tint ?? 0xffffff
    p.blendMode = o.add ? PIXI.BLEND_MODES.ADD : PIXI.BLEND_MODES.NORMAL; p.scale.set(o.esc ?? 1); p.rotation = 0
    p.estirar = !!o.estirar
    p.d = { vx: o.vx || 0, vy: o.vy || 0, g: o.g ?? 0, vida: o.vida || 600, edad: 0, escFin: o.escFin ?? p.scale.x, escIni: p.scale.x, alphaIni: p.alpha, giro: o.giro || 0, freno: o.freno ?? 1 }

  function correrParticulas(ms) {
    const s = ms / 1000
    for (const p of particulas) {
      const d = p.d; d.edad += ms
      d.vy += d.g * s; d.vx *= Math.pow(d.freno, s * 60); d.vy *= Math.pow(d.freno, s * 60)
      p.x += d.vx * s; p.y += d.vy * s; p.rotation += d.giro * s
      const k = Math.min(1, d.edad / d.vida)
      p.alpha = d.alphaIni * (1 - k * k)
      const e = d.escIni + (d.escFin - d.escIni) * k
      if (p.estirar) { const v = Math.hypot(d.vx, d.vy); p.rotation = Math.atan2(d.vy, d.vx); p.scale.set(e * Math.min(2.6, 1 + v / 420), e * .7) } else p.scale.set(e)

      S.mostrado += (S.puntaje - S.mostrado) * Math.min(1, ms * .018)
      if (Math.abs(S.puntaje - S.mostrado) < .5) S.mostrado = S.puntaje
      puntajeTxt.text = Math.round(S.mostrado).toLocaleString('es-AR')
    }
    sacudida *= Math.pow(.86, ms / 16)
    mundo.x = (Math.random() - .5) * sacudida; mundo.y = (Math.random() - .5) * sacudida

    // menu button breathing
    if (menu.visible) { const b = 1 + Math.sin(t * .004) * .045; boton.scale.set(b); botonTxt.scale.set(1 + Math.sin(t * .004) * .02); logo.y = 232 + Math.sin(t * .0015) * 6 }
    if (instr.visible && S.estado === 'instrucciones') botonI.scale.set(1 + Math.sin(t * .005) * .04)
    if (resultado.visible && S.estado === 'resultado') boton2.scale.set(1 + Math.sin(t * .004) * .04)
    // countdowns tick once per second (menu button and results button)
    if (KIOSCO && t - ultimoTic > 1000) {
      ultimoTic = t
      if (sinIntentos() && new Date(estadoKiosco.proximoIntento).getTime() <= Date.now()) { estadoKiosco.intentosQuedan = 1; estadoKiosco.proximoIntento = null }
      if (menu.visible) refrescarMenu()
      if (cuentaResultado && resultado.visible) cuentaResultado.texto.text = new Date(cuentaResultado.hasta).getTime() > Date.now() ? `OTRO INTENTO EN ${cuentaRegresiva(cuentaResultado.hasta)}` : '¡YA PODÉS JUGAR!'
    }

    // adaptive quality: if the cabinet can't hold ~45 fps, drop the water filter and halve particles
    fpsAcum += app.ticker.FPS; fpsN++; fpsT += ms
    if (fpsT > 3000) { const media = fpsAcum / fpsN; if (media < 45 && calidad > .5) { calidad = .5; agua.filters = null; console.warn('calidad reducida, fps', media.toFixed(0)) } fpsAcum = fpsN = fpsT = 0 }
  }
  window.__pesca = { S, empezar, get items() { return items }, ARO, bote, AGUA_Y, app, TX, crearItem }   // for automated tests
}
main().catch(e => { console.error(e); const c = document.getElementById('cargando'); if (c) c.textContent = 'No se pudo cargar el juego' })
</script>
